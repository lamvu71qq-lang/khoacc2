<<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Our Diary ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08080c;color:#fff}
body{background:radial-gradient(circle at 0 0,#35152d 0,transparent 35%),radial-gradient(circle at 100% 0,#152442 0,transparent 35%),#08080c}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{width:min(760px,100%);margin:auto;padding:12px}
.card{background:rgba(19,19,27,.94);border:1px solid #30303b;border-radius:22px;padding:17px;margin-bottom:12px;box-shadow:0 15px 50px #0005}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.login .card{width:min(420px,100%);padding:25px}
.logo{width:74px;height:74px;border-radius:23px;display:grid;place-items:center;margin:0 auto 14px;font-size:38px;background:linear-gradient(135deg,#ff4c98,#775cff)}
h1{font-size:25px;text-align:center;margin:0}
.muted{color:#858591;font-size:13px;text-align:center;margin:8px 0 22px}
label{display:block;color:#aaa;font-size:13px;margin:0 0 7px}
input,textarea,select{width:100%;border:1px solid #363641;background:#111119;color:#fff;border-radius:14px;padding:13px;outline:none;margin-bottom:13px}
textarea{min-height:125px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#ff5b9f}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#ff4c98,#775cff);color:#fff;font-weight:800}
.btn:disabled{opacity:.55}
.err{color:#ff7389;text-align:center;min-height:20px;font-size:13px;margin-top:8px}
.top{position:sticky;top:0;z-index:20;background:#08080cdc;backdrop-filter:blur(18px);border-bottom:1px solid #292933}
.topin{width:min(760px,100%);margin:auto;padding:10px 13px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brandIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#ff4c98,#775cff);font-size:25px}
.brandTitle{font-weight:900;font-size:18px}
.brandSub{font-size:13px;color:#ff6cac;margin-top:2px}
.out{border:1px solid #363641;background:#17171f;color:#aaa;padding:10px 13px;border-radius:12px}
.title{font-size:18px;font-weight:900;margin-bottom:13px}
.small{font-size:12px;color:#777784;margin:-4px 0 12px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{background:#17171f;border:1px solid #2d2d38;border-radius:17px;padding:14px}
.picon{font-size:25px}
.pname{font-weight:900;margin-top:7px}
.psub{font-size:12px;color:#ff6cac;margin-top:3px}
.preview{display:none;position:relative;margin:0 0 13px}
.preview img{width:100%;max-height:380px;object-fit:cover;border-radius:16px;display:block}
.remove{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:22px}
.diary{background:#17171f;border:1px solid #2d2d38;border-radius:18px;padding:15px;margin-bottom:10px}
.head{display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#ff4c98,#775cff)}
.author{font-weight:900}
.time{font-size:11px;color:#777784;margin-top:3px}
.mood{font-size:25px;margin:11px 0 6px}
.content{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.photo{width:100%;max-height:460px;object-fit:cover;border-radius:15px;display:block;margin-top:11px}
.delete{margin-top:10px;border:1px solid #4a2d37;background:#21171b;color:#ff778d;border-radius:10px;padding:7px 10px}
.empty{text-align:center;color:#777784;padding:24px 8px}
.toast{position:fixed;z-index:100;left:50%;bottom:22px;transform:translate(-50%,150px);transition:.25s;background:#25252e;border:1px solid #3b3b47;padding:12px 16px;border-radius:13px;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.chatList{height:330px;overflow:auto;background:#101017;border:1px solid #292934;border-radius:16px;padding:10px;margin-bottom:10px}
.chatmsg{display:flex;margin:7px 0}
.chatmsg.mine{justify-content:flex-end}
.chatbubble{max-width:82%;padding:9px 12px;border-radius:15px;background:#20202a;word-break:break-word}
.chatmsg.mine .chatbubble{background:linear-gradient(135deg,#ff4c98,#775cff)}
.chatname{font-size:11px;font-weight:800;margin-bottom:3px;opacity:.8}
.chattime{font-size:10px;opacity:.6;margin-top:4px;text-align:right}
.reactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reactbtn{border:1px solid #363641;background:#111119;color:#fff;border-radius:12px;padding:6px 9px;font-size:14px}
.reactbtn.active{border-color:#ff5b9f;background:#321726}
@media(max-width:430px){.wrap{padding:8px}.card{padding:14px}.people{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<section id="loginPage" class="login">
  <div class="card">
    <div class="logo">❤️</div>
    <h1>Our Diary</h1>
    <div class="muted">Nhật ký riêng của 2 người</div>
    <label>Tài khoản</label>
    <input id="loginUser" autocomplete="username" placeholder="user1">
    <label>Mật khẩu</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="123456">
    <button id="loginBtn" class="btn">Đăng nhập ❤️</button>
    <div id="loginErr" class="err"></div>
  </div>
</section>

<section id="appPage" class="hidden">
<header class="top">
  <div class="topin">
    <div class="brand">
      <div class="brandIcon">❤️</div>
      <div>
        <div class="brandTitle">Our Diary</div>
        <div id="brandSub" class="brandSub"></div>
      </div>
    </div>
    <button id="logoutBtn" class="out">Đăng xuất</button>
  </div>
</header>

<main class="wrap">

<div class="card">
  <div class="title">💕 Hai người</div>
  <div id="people" class="people"></div>
</div>

<div class="card">
  <div class="title">✍️ Ghi nhật ký</div>
  <label>Nội dung</label>
  <textarea id="entryText" placeholder="Viết điều bạn muốn lưu lại..."></textarea>
  <label>Cảm xúc</label>
  <select id="entryMood">
    <option>❤️</option><option>🥰</option><option>😍</option><option>😊</option>
    <option>😘</option><option>😂</option><option>🥺</option><option>😢</option>
    <option>😡</option><option>😴</option><option>💔</option>
  </select>
  <label>📷 Ảnh đính kèm</label>
  <input id="entryFile" type="file" accept="image/*">
  <div id="preview" class="preview">
    <img id="previewImg">
    <button id="removePhoto" class="remove" type="button">×</button>
  </div>
  <button id="postBtn" class="btn">❤️ Đăng nhật ký</button>
</div>

<div class="card">
  <div class="title">🥰 Đặt biệt danh cho người kia</div>
  <div class="small">Biệt danh này đồng bộ trên cả 2 điện thoại.</div>
  <input id="nicknameInput" placeholder="Ví dụ: Sưuu ❤️">
  <button id="nicknameBtn" class="btn">Lưu biệt danh</button>
</div>

<div class="card">
  <div class="title">💬 Nhắn tin</div>
  <div id="chatList" class="chatList"><div class="empty">Đang tải...</div></div>
  <div style="display:flex;gap:8px">
    <input id="messageInput" placeholder="Nhập tin nhắn..." style="margin:0;flex:1">
    <button id="sendMessageBtn" class="btn" style="width:auto;padding:0 18px">Gửi</button>
  </div>
</div>

<div class="card">
  <div class="title">⚙️ Tài khoản</div>
  <div class="small">Đang đăng nhập: <b id="currentUsername"></b></div>
  <label>Tài khoản mới</label>
  <input id="newUsername" placeholder="Bỏ trống nếu không đổi">
  <label>Mật khẩu hiện tại</label>
  <input id="currentPassword" type="password" placeholder="Mật khẩu hiện tại">
  <label>Mật khẩu mới</label>
  <input id="newPassword" type="password" placeholder="Bỏ trống nếu không đổi">
  <label>Nhập lại mật khẩu mới</label>
  <input id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu mới">
  <button id="accountBtn" class="btn">💾 Lưu thay đổi</button>
</div>

<div class="card">
  <div class="title">📖 Nhật ký chung</div>
  <div id="diaryList"><div class="empty">Đang tải...</div></div>
</div>

</main>
</section>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   SUPABASE
   ========================================================= */
const SUPABASE_URL="https://mmgqalltjkwpnxmfrajh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Ce_O6R53zyBorjk9eF0tUg_XwstpHWk";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* =========================================================
   TELEGRAM - CHỈ THAY TOKEN Ở ĐÂY
   ========================================================= */
const TELEGRAM_BOT_TOKEN="8503723223:AAF8FonAHhyHUz7vKmy-7K7sBPqYJUJlCwo";
const TELEGRAM_CHAT_ID="-5515276053";

let me=null;
let allUsers=[];
let sharedNickname="";
let reactions={};
let liveChannel=null;

const $=id=>document.getElementById(id);

function escapeHTML(v){
  return String(v??"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(text){
  const x=$("toast");
  x.textContent=text;
  x.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>x.classList.remove("show"),2800);
}

function nicknameFor(user){
  if(sharedNickname) return sharedNickname;
  return user?.display_name || user?.username || "Người dùng";
}

function otherUser(){
  return allUsers.find(u=>String(u.id)!==String(me.id));
}

/* =========================================================
   LOGIN
   ========================================================= */
async function login(){
  const username=$("loginUser").value.trim();
  const password=$("loginPass").value;

  if(!username||!password){
    $("loginErr").textContent="Nhập tài khoản và mật khẩu.";
    return;
  }

  $("loginBtn").disabled=true;
  $("loginBtn").textContent="Đang đăng nhập...";
  $("loginErr").textContent="";

  try{
    const {data,error}=await supabaseClient.rpc("login_diary",{
      p_username:username,
      p_password:password
    });

    if(error)throw error;
    if(!data?.length)throw new Error("Sai tài khoản hoặc mật khẩu.");

    me=data[0];
    sessionStorage.setItem("diary_current_user",JSON.stringify(me));
    await openApp();
  }catch(e){
    console.error(e);
    $("loginErr").textContent=e.message||"Đăng nhập thất bại.";
  }finally{
    $("loginBtn").disabled=false;
    $("loginBtn").textContent="Đăng nhập ❤️";
  }
}

/* =========================================================
   OPEN
   ========================================================= */
async function openApp(){
  $("loginPage").classList.add("hidden");
  $("appPage").classList.remove("hidden");

  try{
    await loadUsers();
    await loadNickname();
    renderPeople();
    await Promise.all([loadEntries(),loadMessages()]);
    subscribeRealtime();
  }catch(e){
    console.error(e);
    toast("Lỗi tải dữ liệu: "+e.message);
  }
}

async function loadUsers(){
  const {data,error}=await supabaseClient.rpc("get_diary_users");
  if(error)throw error;
  allUsers=data||[];
}

async function loadNickname(){
  const {data,error}=await supabaseClient
    .from("diary_shared_settings")
    .select("nickname")
    .eq("id",1)
    .maybeSingle();

  if(error)throw error;
  sharedNickname=data?.nickname||"";
}

function renderPeople(){
  $("brandSub").textContent=nicknameFor(me);
  $("currentUsername").textContent=me.username||"";

  $("people").innerHTML=allUsers.map(u=>{
    const mine=String(u.id)===String(me.id);
    return `
      <div class="person">
        <div class="picon">${mine?"🧑":"❤️"}</div>
        <div class="pname">${escapeHTML(nicknameFor(u))}</div>
        <div class="psub">${mine?"Bạn":"Người kia"}</div>
      </div>`;
  }).join("");
}

/* =========================================================
   BIỆT DANH
   ========================================================= */
async function saveNickname(){
  const nickname=$("nicknameInput").value.trim();
  if(!nickname){
    toast("Hãy nhập biệt danh.");
    return;
  }

  $("nicknameBtn").disabled=true;

  try{
    const {data,error}=await supabaseClient.rpc("update_diary_nickname",{
      p_nickname:nickname
    });

    if(error)throw error;

    sharedNickname=data||nickname;
    $("nicknameInput").value="";
    renderPeople();
    await loadEntries();
    toast("Đã đổi biệt danh ❤️");
  }catch(e){
    console.error(e);
    toast("Không đổi được biệt danh: "+e.message);
  }finally{
    $("nicknameBtn").disabled=false;
  }
}

/* =========================================================
   ACCOUNT
   ========================================================= */
async function updateAccount(){
  const username=$("newUsername").value.trim();
  const currentPassword=$("currentPassword").value;
  const newPassword=$("newPassword").value;
  const confirmPassword=$("confirmPassword").value;

  if(!username&&!newPassword){
    toast("Nhập tài khoản mới hoặc mật khẩu mới.");
    return;
  }

  if(!currentPassword){
    toast("Nhập mật khẩu hiện tại.");
    return;
  }

  if(newPassword!==confirmPassword){
    toast("Mật khẩu mới không trùng nhau.");
    return;
  }

  $("accountBtn").disabled=true;
  $("accountBtn").textContent="Đang lưu...";

  try{
    const {data,error}=await supabaseClient.rpc("update_diary_account",{
      p_user_id:me.id,
      p_current_password:currentPassword,
      p_new_username:username||null,
      p_new_password:newPassword||null
    });

    if(error)throw error;
    if(!data?.length)throw new Error("Không nhận được kết quả cập nhật.");

    me.username=data[0].new_username||data[0].username||me.username;
    sessionStorage.setItem("diary_current_user",JSON.stringify(me));

    $("currentUsername").textContent=me.username;
    $("newUsername").value="";
    $("currentPassword").value="";
    $("newPassword").value="";
    $("confirmPassword").value="";

    toast("Đã đổi tài khoản/mật khẩu ❤️");
  }catch(e){
    console.error(e);
    toast("Không đổi được tài khoản: "+e.message);
  }finally{
    $("accountBtn").disabled=false;
    $("accountBtn").textContent="💾 Lưu thay đổi";
  }
}

/* =========================================================
   IMAGE
   ========================================================= */
$("entryFile").addEventListener("change",()=>{
  const file=$("entryFile").files[0];

  if(!file){
    removePhoto();
    return;
  }

  if(!file.type.startsWith("image/")){
    toast("Chỉ được chọn ảnh.");
    $("entryFile").value="";
    return;
  }

  if(file.size>10*1024*1024){
    toast("Ảnh tối đa 10MB.");
    $("entryFile").value="";
    return;
  }

  $("previewImg").src=URL.createObjectURL(file);
  $("preview").style.display="block";
});

function removePhoto(){
  $("entryFile").value="";
  $("previewImg").removeAttribute("src");
  $("preview").style.display="none";
}

async function uploadImage(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path=me.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;

  const {error}=await supabaseClient
    .storage
    .from("diary-images")
    .upload(path,file,{upsert:false,contentType:file.type});

  if(error)throw error;

  const {data}=supabaseClient
    .storage
    .from("diary-images")
    .getPublicUrl(path);

  return data.publicUrl;
}

/* =========================================================
   POST DIARY
   ========================================================= */
async function postEntry(){
  const content=$("entryText").value.trim();
  const mood=$("entryMood").value;
  const file=$("entryFile").files[0];

  if(!content&&!file){
    toast("Viết nội dung hoặc chọn ảnh.");
    return;
  }

  $("postBtn").disabled=true;
  $("postBtn").textContent="Đang đăng...";

  try{
    let image_url=null;

    if(file){
      image_url=await uploadImage(file);
    }

    const {error}=await supabaseClient
      .from("diary_entries")
      .insert({
        user_id:me.id,
        content:content||null,
        mood:mood,
        image_url:image_url
      });

    if(error)throw error;

    $("entryText").value="";
    removePhoto();
    await loadEntries();

    toast("Đã đăng nhật ký ❤️");
    sendTelegram(
      "❤️ "+nicknameFor(me)+" đã up ghi chú"
    ).catch(console.error);

  }catch(e){
    console.error(e);
    toast("Không đăng được: "+e.message);
  }finally{
    $("postBtn").disabled=false;
    $("postBtn").textContent="❤️ Đăng nhật ký";
  }
}

/* =========================================================
   TELEGRAM
   ========================================================= */
async function sendTelegram(text){
  if(!TELEGRAM_BOT_TOKEN||
     TELEGRAM_BOT_TOKEN==="DÁN_TOKEN_BOT_MỚI_VÀO_ĐÂY"){
    console.warn("Chưa thay TELEGRAM_BOT_TOKEN.");
    return;
  }

  const r=await fetch(
    "https://api.telegram.org/bot"+TELEGRAM_BOT_TOKEN+"/sendMessage",
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        chat_id:TELEGRAM_CHAT_ID,
        text:text
      })
    }
  );

  const result=await r.json();

  if(!result.ok){
    throw new Error(result.description||"Telegram API lỗi");
  }
}

/* =========================================================
   DIARY
   ========================================================= */
async function loadEntries(){
  const {data,error}=await supabaseClient
    .from("diary_entries")
    .select("id,user_id,content,mood,image_url,created_at")
    .order("created_at",{ascending:false});

  if(error)throw error;

  const ids=(data||[]).map(x=>x.id);

  reactions={};

  if(ids.length){
    const rr=await supabaseClient
      .from("diary_reactions")
      .select("id,entry_id,user_id,reaction")
      .in("entry_id",ids);

    if(rr.error)throw rr.error;

    (rr.data||[]).forEach(r=>{
      if(!reactions[r.entry_id])reactions[r.entry_id]=[];
      reactions[r.entry_id].push(r);
    });
  }

  const box=$("diaryList");

  if(!data?.length){
    box.innerHTML='<div class="empty">Chưa có ghi chú nào ❤️</div>';
    return;
  }

  box.innerHTML="";

  data.forEach(entry=>{
    const author=allUsers.find(u=>String(u.id)===String(entry.user_id));
    const rows=reactions[entry.id]||[];
    const time=new Date(entry.created_at).toLocaleString("vi-VN",{
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });

    const el=document.createElement("div");
    el.className="diary";

    const reactButtons=["❤️","😂","🥰","😮","😢","😡"].map(r=>{
      const mine=rows.some(x=>String(x.user_id)===String(me.id)&&x.reaction===r);
      const count=rows.filter(x=>x.reaction===r).length;

      return `
        <button
          class="reactbtn ${mine?"active":""}"
          data-entry="${escapeHTML(entry.id)}"
          data-reaction="${r}">
          ${r}${count?" "+count:""}
        </button>`;
    }).join("");

    el.innerHTML=`
      <div class="head">
        <div class="avatar">❤️</div>
        <div>
          <div class="author">${escapeHTML(nicknameFor(author))}</div>
          <div class="time">${escapeHTML(time)}</div>
        </div>
      </div>

      <div class="mood">${escapeHTML(entry.mood||"❤️")}</div>

      ${entry.content?
        `<div class="content">${escapeHTML(entry.content)}</div>`:""}

      ${entry.image_url?
        `<img class="photo" src="${escapeHTML(entry.image_url)}" loading="lazy">`:""}

      <div class="reactions">${reactButtons}</div>

      ${String(entry.user_id)===String(me.id)?
        `<button class="delete" data-id="${escapeHTML(entry.id)}">🗑 Xóa</button>`:""}
    `;

    box.appendChild(el);
  });

  box.querySelectorAll(".reactbtn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      toggleReaction(btn.dataset.entry,btn.dataset.reaction);
    });
  });

  box.querySelectorAll(".delete").forEach(btn=>{
    btn.addEventListener("click",()=>{
      deleteEntry(btn.dataset.id);
    });
  });
}

/* =========================================================
   REACTION
   ========================================================= */
async function toggleReaction(entryId,reaction){
  try{
    const {error}=await supabaseClient.rpc("toggle_diary_reaction",{
      p_entry_id:entryId,
      p_user_id:me.id,
      p_reaction:reaction
    });

    if(error)throw error;

    await loadEntries();
  }catch(e){
    console.error(e);
    toast("Không thả cảm xúc được: "+e.message);
  }
}

/* =========================================================
   DELETE
   ========================================================= */
async function deleteEntry(id){
  if(!confirm("Xóa nhật ký này?"))return;

  const {error}=await supabaseClient
    .from("diary_entries")
    .delete()
    .eq("id",id)
    .eq("user_id",me.id);

  if(error){
    toast("Không xóa được: "+error.message);
    return;
  }

  await loadEntries();
  toast("Đã xóa nhật ký.");
}

/* =========================================================
   CHAT
   ========================================================= */
async function loadMessages(){
  const {data,error}=await supabaseClient
    .from("diary_messages")
    .select("id,sender_id,receiver_id,message,created_at")
    .order("created_at",{ascending:true});

  if(error)throw error;

  const box=$("chatList");

  if(!data?.length){
    box.innerHTML='<div class="empty">Chưa có tin nhắn.</div>';
    return;
  }

  box.innerHTML="";

  data.forEach(msg=>{
    const sender=allUsers.find(u=>String(u.id)===String(msg.sender_id));
    const receiver=allUsers.find(u=>String(u.id)===String(msg.receiver_id));
    const mine=String(msg.sender_id)===String(me.id);

    const time=new Date(msg.created_at).toLocaleTimeString("vi-VN",{
      hour:"2-digit",
      minute:"2-digit"
    });

    const el=document.createElement("div");
    el.className="chatmsg"+(mine?" mine":"");

    el.innerHTML=`
      <div class="chatbubble">
        <div class="chatname">
          ${escapeHTML(nicknameFor(sender))}
          →
          ${escapeHTML(nicknameFor(receiver))}
        </div>
        <div>${escapeHTML(msg.message)}</div>
        <div class="chattime">${escapeHTML(time)}</div>
      </div>
    `;

    box.appendChild(el);
  });

  box.scrollTop=box.scrollHeight;
}

async function sendMessage(){
  const message=$("messageInput").value.trim();

  if(!message)return;

  const receiver=otherUser();

  if(!receiver){
    toast("Không tìm thấy người kia.");
    return;
  }

  $("sendMessageBtn").disabled=true;

  try{
    const {error}=await supabaseClient.rpc("send_diary_message",{
      p_sender_id:me.id,
      p_receiver_id:receiver.id,
      p_message:message
    });

    if(error)throw error;

    $("messageInput").value="";
    await loadMessages();

    sendTelegram(
      "💬 "+nicknameFor(me)+" đã gửi tn cho "+nicknameFor(receiver)
    ).catch(console.error);

  }catch(e){
    console.error(e);
    toast("Không gửi được tin nhắn: "+e.message);
  }finally{
    $("sendMessageBtn").disabled=false;
  }
}

/* =========================================================
   REALTIME
   ========================================================= */
function subscribeRealtime(){
  if(liveChannel){
    supabaseClient.removeChannel(liveChannel);
  }

  liveChannel=supabaseClient
    .channel("our-diary-live-"+Date.now())

    .on(
      "postgres_changes",
      {event:"*",schema:"public",table:"diary_entries"},
      ()=>loadEntries().catch(console.error)
    )

    .on(
      "postgres_changes",
      {event:"*",schema:"public",table:"diary_reactions"},
      ()=>loadEntries().catch(console.error)
    )

    .on(
      "postgres_changes",
      {event:"*",schema:"public",table:"diary_messages"},
      ()=>loadMessages().catch(console.error)
    )

    .on(
      "postgres_changes",
      {event:"*",schema:"public",table:"diary_shared_settings"},
      async()=>{
        try{
          await loadNickname();
          renderPeople();
          await loadEntries();
          await loadMessages();
        }catch(e){
          console.error(e);
        }
      }
    )

    .subscribe();
}

/* =========================================================
   EVENTS
   ========================================================= */
$("loginBtn").addEventListener("click",login);
$("logoutBtn").addEventListener("click",()=>{
  if(liveChannel)supabaseClient.removeChannel(liveChannel);
  sessionStorage.removeItem("diary_current_user");
  location.reload();
});

$("postBtn").addEventListener("click",postEntry);
$("nicknameBtn").addEventListener("click",saveNickname);
$("accountBtn").addEventListener("click",updateAccount);
$("sendMessageBtn").addEventListener("click",sendMessage);
$("removePhoto").addEventListener("click",removePhoto);

$("loginPass").addEventListener("keydown",e=>{
  if(e.key==="Enter")login();
});

$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    sendMessage();
  }
});

/* =========================================================
   AUTO LOGIN
   ========================================================= */
(async()=>{
  const saved=sessionStorage.getItem("diary_current_user");
  if(!saved)return;

  try{
    me=JSON.parse(saved);
    await openApp();
  }catch(e){
    console.error(e);
    sessionStorage.removeItem("diary_current_user");
  }
})();
</script>
