<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý doanh thu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:20px;
    }
    .box{
      max-width:1000px;
      margin:auto;
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 10px rgba(0,0,0,.1);
    }
    h2,h3{
      color:#2563eb;
    }
    input{
      padding:10px;
      margin:5px;
      width:180px;
    }
    button{
      padding:10px 15px;
      background:#16a34a;
      color:#fff;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }
    button:hover{
      background:#15803d;
    }
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }
    th,td{
      border:1px solid #ddd;
      padding:10px;
      text-align:center;
    }
    th{
      background:#2563eb;
      color:white;
    }
    .revenue{
      margin-top:15px;
      font-size:24px;
      font-weight:bold;
      color:#dc2626;
      text-align:right;
    }
    .hidden{
      display:none;
    }
  </style>
</head>
<body>

<div class="box">

  <!-- ĐĂNG NHẬP -->
  <div id="loginBox">
    <h2>Đăng nhập hệ thống</h2>
    <input id="username" value="admin" placeholder="Tài khoản">
    <input id="password" type="password" value="1" placeholder="Mật khẩu">
    <button onclick="login()">Đăng nhập</button>
  </div>

  <!-- ỨNG DỤNG -->
  <div id="app" class="hidden">

    <h2>Quản lý đơn hàng & doanh thu</h2>

    <div id="userInfo"></div>
    <button onclick="logout()">Đăng xuất</button>

    <!-- ADMIN -->
    <div id="adminPanel" class="hidden">

      <hr>

      <h3>Thêm đơn hàng</h3>

      <input id="product" placeholder="Tên sản phẩm">
      <input id="quantity" type="number" placeholder="Số lượng">
      <input id="price" type="number" placeholder="Đơn giá">

      <button onclick="addOrder()">Thêm đơn hàng</button>

      <hr>

      <h3>Tạo tài khoản nhân viên</h3>

      <input id="staffUser" placeholder="Tài khoản nhân viên">
      <input id="staffPass" placeholder="Mật khẩu">

      <button onclick="createStaff()">Tạo nhân viên</button>

    </div>

    <hr>

    <h3>Danh sách đơn hàng</h3>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Sản phẩm</th>
          <th>Số lượng</th>
          <th>Đơn giá</th>
          <th>Thành tiền</th>
          <th>Người tạo</th>
        </tr>
      </thead>
      <tbody id="orderTable"></tbody>
    </table>

    <div class="revenue" id="revenue">
      Tổng doanh thu: 0 VNĐ
    </div>

  </div>

</div>

<script>
const SUPABASE_URL = "https://kcefcigkeglvxmfmtrqc.supabase.co";
const SUPABASE_KEY = "sb_publishable_fM2oUc3igkLmF4ZP_lMeMA_pBzKh_0o";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

async function login(){

  const username =
    document.getElementById('username').value.trim();

  const password =
    document.getElementById('password').value;

  const {data,error} =
    await db
      .from('users')
      .select('*')
      .eq('username',username)
      .eq('password',password)
      .single();

  if(error || !data){
    alert('Sai tài khoản hoặc mật khẩu');
    return;
  }

  currentUser = data;

  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('userInfo').innerHTML =
    '<b>Xin chào:</b> ' +
    data.username +
    ' (' + data.role + ')';

  if(data.role === 'admin'){
    document
      .getElementById('adminPanel')
      .classList.remove('hidden');
  }

  loadOrders();
}

function logout(){
  currentUser = null;
  location.reload();
}

async function loadOrders(){

  const {data,error} =
    await db
      .from('orders')
      .select('*')
      .order('id',{ascending:true});

  if(error){
    console.error(error);
    return;
  }

  const tbody =
    document.getElementById('orderTable');

  tbody.innerHTML = '';

  let revenue = 0;

  data.forEach(item => {

    revenue += Number(item.total);

    tbody.innerHTML += `
      <tr>
        <td>${item.id}</td>
        <td>${item.product}</td>
        <td>${item.quantity}</td>
        <td>${Number(item.price).toLocaleString('vi-VN')}</td>
        <td>${Number(item.total).toLocaleString('vi-VN')}</td>
        <td>${item.created_by || ''}</td>
      </tr>
    `;

  });

  document.getElementById('revenue').innerText =
    'Tổng doanh thu: ' +
    revenue.toLocaleString('vi-VN') +
    ' VNĐ';

}

async function addOrder(){

  if(currentUser.role !== 'admin'){
    alert('Chỉ admin được thêm đơn hàng');
    return;
  }

  const product =
    document.getElementById('product').value.trim();

  const quantity =
    Number(document.getElementById('quantity').value);

  const price =
    Number(document.getElementById('price').value);

  if(!product || quantity <= 0 || price <= 0){
    alert('Nhập đầy đủ thông tin');
    return;
  }

  const total = quantity * price;

  const {error} =
    await db
      .from('orders')
      .insert({
        product,
        quantity,
        price,
        total,
        created_by: currentUser.username
      });

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById('product').value = '';
  document.getElementById('quantity').value = '';
  document.getElementById('price').value = '';

  loadOrders();

}

async function createStaff(){

  if(currentUser.role !== 'admin'){
    alert('Chỉ admin được tạo nhân viên');
    return;
  }

  const username =
    document.getElementById('staffUser').value.trim();

  const password =
    document.getElementById('staffPass').value;

  if(!username || !password){
    alert('Nhập tài khoản và mật khẩu');
    return;
  }

  const {error} =
    await db
      .from('users')
      .insert({
        username,
        password,
        role:'staff'
      });

  if(error){
    alert(error.message);
    return;
  }

  alert('Đã tạo nhân viên');

  document.getElementById('staffUser').value = '';
  document.getElementById('staffPass').value = '';

}
</script>

</body>
</html>
