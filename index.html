];


let foods=
JSON.parse(localStorage.getItem("foods")) ||
defaultFoods;

let orders=
JSON.parse(localStorage.getItem("orders")) ||
[];

let cart=[];


/* =================================================
   HELPERS
================================================= */

function money(n){
    return Number(n).toLocaleString("vi-VN")+"đ";
}

function escapeHtml(text){
    return String(text ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function saveAll(){

    localStorage.setItem(
        "foods",
        JSON.stringify(foods)
    );

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );

}


/* =================================================
   CUSTOMER MENU
================================================= */

function renderFoods(category="all"){

    let list=foods;

    if(category!=="all"){
        list=foods.filter(
            x=>x.category===category
        );
    }

    const box=
        document.getElementById("foodList");

    if(!list.length){

        box.innerHTML=
        `<div class="empty">
            Chưa có món trong mục này.
        </div>`;

        return;
    }

    box.innerHTML=
        list.map(food=>`

        <div class="food">

            <img
                class="food-img"
                src="${escapeHtml(food.img)}"
                alt="${escapeHtml(food.name)}"
                onerror="this.style.display='none'">

            <div class="food-content">

                <div class="food-name">
                    ${escapeHtml(food.name)}
                </div>

                <div class="food-desc">
                    ${escapeHtml(food.desc)}
                </div>

                <div class="food-bottom">

                    <div class="price">
                        ${money(food.price)}
                    </div>

                    <button
                        class="add-btn"
                        onclick="addCart(${food.id})">

                        + Thêm

                    </button>

                </div>

            </div>

        </div>

    `).join("");

}


function changeCategory(category,btn){

    document.querySelectorAll(".cat")
    .forEach(x=>
        x.classList.remove("active")
    );

    btn.classList.add("active");

    const title={
        all:"Tất cả món",
        main:"🍚 Ăn chính",
        snack:"🍟 Ăn vặt",
        extra:"🧀 Đồ ăn thêm",
        drink:"🥤 Đồ uống"
    };

    document.getElementById("sectionTitle")
        .textContent=title[category];

    renderFoods(category);

}


/* =================================================
   CART
================================================= */

function addCart(id){

    const food=
        foods.find(x=>x.id===id);

    if(!food)return;

    const item=
        cart.find(x=>x.id===id);

    if(item){
        item.qty++;
    }else{
        cart.push({
            ...food,
            qty:1
        });
    }

    updateCart();

}


function updateCart(){

    const count=
        cart.reduce(
            (s,x)=>s+x.qty,
            0
        );

    const total=
        cart.reduce(
            (s,x)=>s+x.price*x.qty,
            0
        );

    document.getElementById("cartCount")
        .textContent=count;

    document.getElementById("bottomTotal")
        .textContent=money(total);

}


function openCart(){

    renderCart();

    document.getElementById("cartModal")
        .classList.add("show");

}


function renderCart(){

    const box=
        document.getElementById("cartItems");

    if(!cart.length){

        box.innerHTML=
        `<div class="empty">
            🛒 Giỏ hàng đang trống
        </div>`;

        document.getElementById("cartTotal")
            .textContent="0đ";

        return;
    }

    box.innerHTML=
        cart.map(item=>`

        <div class="cart-item">

            <div class="cart-info">

                <div class="cart-name">
                    ${escapeHtml(item.name)}
                </div>

                <div class="cart-price">
                    ${money(item.price)}
                </div>

            </div>

            <div class="qty">

                <button
                    onclick="changeQty(${item.id},-1)">
                    −
                </button>

                <b>${item.qty}</b>

                <button
                    onclick="changeQty(${item.id},1)">
                    +
                </button>

            </div>

        </div>

    `).join("");

    const total=
        cart.reduce(
            (s,x)=>s+x.price*x.qty,
            0
        );

    document.getElementById("cartTotal")
        .textContent=money(total);

}


function changeQty(id,value){

    const item=
        cart.find(x=>x.id===id);

    if(!item)return;

    item.qty+=value;

    if(item.qty<=0){

        cart=
            cart.filter(x=>x.id!==id);

    }

    updateCart();
    renderCart();

}


/* =================================================
   CHECKOUT
================================================= */

function openCheckout(){

    if(!cart.length){

        alert("Giỏ hàng đang trống!");

        return;
    }

    closeModal("cartModal");

    document.getElementById("checkoutModal")
        .classList.add("show");

}


function placeOrder(){

    const name=
        document.getElementById("customerName")
        .value.trim();

    const phone=
        document.getElementById("customerPhone")
        .value.trim();

    const address=
        document.getElementById("customerAddress")
        .value.trim();

    const payment=
        document.getElementById("payment")
        .value;

    if(!name||!phone||!address){

        alert("Vui lòng nhập đầy đủ thông tin!");

        return;
    }

    const total=
        cart.reduce(
            (s,x)=>s+x.price*x.qty,
            0
        );

    const order={

        id:
            "OD"+
            Date.now()
            .toString()
            .slice(-7),

        customer:{
            name,
            phone,
            address
        },

        payment,

        items:
            JSON.parse(
                JSON.stringify(cart)
            ),

        total,

        status:"Chờ xác nhận",

        createdAt:
            new Date()
            .toLocaleString("vi-VN")

    };

    orders.push(order);

    saveAll();

    document.getElementById("orderCode")
        .textContent=order.id;

    closeModal("checkoutModal");

    document.getElementById("successModal")
        .classList.add("show");

    cart=[];

    updateCart();

}

function adminTab(id,btn){

        );

/* =================================================
   ADMIN FOOD
================================================= */

function addFood(){

    const name=
        document.getElementById("foodName")
        .value.trim();

    const price=
        Number(
            document.getElementById("foodPrice")
            .value
        );

    const category=
        document.getElementById("foodCategory")
        .value;

    const desc=
        document.getElementById("foodDesc")
        .value.trim();

    const img=
        document.getElementById("foodImage")
        .value.trim();


    if(!name){

        alert("Nhập tên món!");

        return;
    }

    if(!price||price<=0){

        alert("Nhập giá hợp lệ!");

        return;
    }


    foods.push({

        id:Date.now(),

        name,

        price,

        category,

        desc:
            desc ||
            "Món ăn ngon",

        img:
            img ||
            "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=900"

    });


    saveAll();

    document.getElementById("foodName").value="";
    document.getElementById("foodPrice").value="";
    document.getElementById("foodDesc").value="";
    document.getElementById("foodImage").value="";

    renderAdmin();

    renderFoods();

    alert("Đã thêm món!");

}


function categoryName(c){

    return {

        main:"🍚 Ăn chính",

        snack:"🍟 Ăn vặt",

        extra:"🧀 Đồ ăn thêm",

        drink:"🥤 Đồ uống"

    }[c] || c;

}


function renderAdminFoods(){

    const box=
        document.getElementById("adminFoodList");

    if(!foods.length){

        box.innerHTML=
        `<div class="empty">
            Chưa có món.
        </div>`;

        return;
    }


    box.innerHTML=
        foods.map(food=>`

        <div class="admin-food">

            <img
                src="${escapeHtml(food.img)}"
                onerror="this.style.display='none'">

            <div class="admin-food-info">

                <div class="admin-food-name">
                    ${escapeHtml(food.name)}
                </div>

                <div class="admin-food-price">
                    ${money(food.price)}
                </div>

                <div class="admin-food-cat">
                    ${categoryName(food.category)}
                </div>

            </div>

            <div class="action-row">

                <button
                    class="small-btn edit"
                    onclick="editFood(${food.id})">
                    Sửa
                </button>

                <button
                    class="small-btn delete"
                    onclick="deleteFood(${food.id})">
                    Xóa
                </button>

            </div>

        </div>

    `).join("");

}


function editFood(id){

    const food=
        foods.find(x=>x.id===id);

    if(!food)return;


    const name=
        prompt(
            "Tên món:",
            food.name
        );

    if(name===null)return;


    const price=
        prompt(
            "Giá:",
            food.price
        );

    if(price===null)return;


    const desc=
        prompt(
            "Mô tả:",
            food.desc
        );

    if(desc===null)return;


    food.name=name.trim();

    food.price=Number(price);

    food.desc=desc.trim();

    saveAll();

    renderAdmin();

    renderFoods();

}


function deleteFood(id){

    const food=
        foods.find(x=>x.id===id);

    if(!food)return;

    if(!confirm(
        "Xóa món \""+
        food.name+
        "\"?"
    ))return;

    foods=
        foods.filter(
            x=>x.id!==id
        );

    saveAll();

    renderAdmin();

    renderFoods();

}

                📞

                ${escapeHtml(order.customer.address)}

                </option>

    `).join("");

}


function changeOrderStatus(id,status){

    const order=
        orders.find(x=>x.id===id);

    if(!order)return;

    order.status=status;

    saveAll();

    renderAdmin();

}


/* =================================================
   DASHBOARD
================================================= */

function renderDashboard(){

    document.getElementById("statFoods")
        .textContent=foods.length;

    document.getElementById("statOrders")
        .textContent=orders.length;

    document.getElementById("statPending")
        .textContent=
        orders.filter(
            x=>
                x.status!=="Hoàn thành" &&
                x.status!=="Đã hủy"
        ).length;

    const revenue=
        orders
        .filter(x=>x.status==="Hoàn thành")
        .reduce(
            (s,x)=>s+x.total,
            0
        );

    document.getElementById("statRevenue")
        .textContent=money(revenue);

}
