<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý doanh thu - Supabase</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f2f2f2;
      margin:0;
      padding:30px;
    }
    .container{
      max-width:900px;
      margin:auto;
      background:#fff;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 10px rgba(0,0,0,.1);
    }
    h2{
      text-align:center;
      color:#2563eb;
    }
    .form{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }
    input{
      padding:10px;
      flex:1;
      min-width:150px;
    }
    button{
      padding:10px 20px;
      background:#16a34a;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
    button:hover{
      background:#15803d;
    }
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }
    th, td{
      border:1px solid #ddd;
      padding:10px;
      text-align:center;
    }
    th{
      background:#2563eb;
      color:white;
    }
    .revenue{
      margin-top:20px;
      text-align:right;
      font-size:22px;
      font-weight:bold;
      color:#dc2626;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Quản lý đơn hàng & doanh thu</h2>

  <div class="form">
    <input type="text" id="product" placeholder="Tên sản phẩm">
    <input type="number" id="quantity" placeholder="Số lượng">
    <input type="number" id="price" placeholder="Đơn giá (VNĐ)">
    <button onclick="addOrder()">Thêm đơn hàng</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Sản phẩm</th>
        <th>Số lượng</th>
        <th>Đơn giá</th>
        <th>Thành tiền</th>
      </tr>
    </thead>
    <tbody id="orderTable"></tbody>
  </table>

  <div class="revenue" id="revenue">Tổng doanh thu: 0 VNĐ</div>
</div>

<script>
  // ====== KẾT NỐI SUPABASE ======
  const SUPABASE_URL = "https://kcefcigkeglvxmfmtrqc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_fM2oUc3igkLmF4ZP_lMeMA_pBzKh_0o";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ====== HIỂN THỊ DỮ LIỆU ======
  async function loadOrders() {
    const { data, error } = await db
      .from("orders")
      .select("*")
      .order("id", { ascending: true });

    if (error) {
      console.error(error);
      alert("Không thể tải dữ liệu từ Supabase!");
      return;
    }

    const tbody = document.getElementById("orderTable");
    tbody.innerHTML = "";

    let revenue = 0;

    data.forEach(item => {
      revenue += Number(item.total);

      tbody.innerHTML += `
        <tr>
          <td>${item.id}</td>
          <td>${item.product}</td>
          <td>${item.quantity}</td>
          &lttd>${Number(item.price).toLocaleString("vi-VN")}</td>
          <td>${Number(item.total).toLocaleString("vi-VN")}</td>
        </tr>
      `;
    });

    document.getElementById("revenue").innerText =
      "Tổng doanh thu: " + revenue.toLocaleString("vi-VN") + " VNĐ";
  }

  // ====== THÊM ĐƠN HÀNG ======
  async function addOrder() {
    const product = document.getElementById("product").value.trim();
    const quantity = parseInt(document.getElementById("quantity").value);
    const price = parseFloat(document.getElementById("price").value);

    if (!product || quantity <= 0 || price <= 0) {
      alert("Vui lòng nhập đầy đủ thông tin!");
      return;
    }

    const total = quantity * price;

    const { error } = await db.from("orders").insert([
      {
        product,
        quantity,
        price,
        total
      }
    ]);

    if (error) {
      console.error(error);
      alert("Lỗi khi lưu đơn hàng!");
      return;
    }

    document.getElementById("product").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";

    loadOrders();
  }

  // ====== KHỞI ĐỘNG ======
  loadOrders();
</script>

</body>
</html>
