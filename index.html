<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nhật Ký Hai Người ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 20% 0%,#421b39,transparent 35%),
      radial-gradient(circle at 100% 20%,#172d4b,transparent 35%),
      #09090d;
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

#login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    padding:30px 24px;
    border-radius:28px;
    background:rgba(20,20,28,.92);
    border:1px solid #30303b;
    box-shadow:0 30px 100px #0008;
}

.logo{
    width:75px;
    height:75px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    border-radius:24px;
    font-size:38px;
    background:linear-gradient(135deg,#ff428e,#865aff);
}

h1{
    text-align:center;
    margin:18px 0 5px;
}

.sub{
    text-align:center;
    color:#888894;
    margin-bottom:25px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

input,textarea,select{
    width:100%;
    border:1px solid #30303b;
    outline:none;
    border-radius:14px;
    padding:13px;
    background:#111118;
    color:#fff;
    margin-bottom:15px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,textarea:focus,select:focus{
    border-color:#ff579d;
}

.main-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    color:#fff;
    font-weight:900;
    background:linear-gradient(135deg,#ff438f,#8a5cff);
}

.error{
    min-height:20px;
    text-align:center;
    color:#ff7189;
    font-size:13px;
    margin-top:10px;
}

#app{min-height:100vh}

.top{
    position:sticky;
    top:0;
    z-index:10;
    background:#09090dcc;
    backdrop-filter:blur(20px);
    border-bottom:1px solid #24242d;
}

.top-in{
    max-width:760px;
    margin:auto;
    padding:12px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:linear-gradient(135deg,#ff428e,#8a5cff);
}

.brand-name{
    font-weight:900;
}

.brand-user{
    color:#ff67ac;
    font-size:12px;
}

.logout{
    border:1px solid #33333d;
    background:#17171e;
    color:#aaa;
    border-radius:11px;
    padding:9px 11px;
}

.container{
    max-width:760px;
    margin:auto;
    padding:14px;
}

.card{
    background:#13131aee;
    border:1px solid #292933;
    border-radius:22px;
    padding:17px;
    margin-bottom:14px;
}

.card-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:15px;
}

.people{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.person{
    background:#191921;
    border:1px solid #2c2c37;
    border-radius:18px;
    padding:15px;
}

.person-icon{
    font-size:27px;
}

.person-name{
    margin-top:7px;
    font-weight:900;
}

.person-nick{
    margin-top:4px;
    color:#ff67ac;
    font-size:13px;
}

.photo-preview{
    display:none;
    position:relative;
    margin-bottom:12px;
}

.photo-preview img{
    width:100%;
    max-height:350px;
    object-fit:cover;
    border-radius:17px;
}

.remove-photo{
    position:absolute;
    right:8px;
    top:8px;
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:#000b;
    color:#fff;
    font-size:20px;
}

.diary{
    padding:16px;
    background:#17171f;
    border:1px solid #292934;
    border-radius:20px;
    margin-bottom:12px;
}

.diary-head{
    display:flex;
    justify-content:space-between;
}

.author{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:linear-gradient(135deg,#ff438f,#855bff);
}

.author-name{
    font-weight:900;
}

.time{
    color:#70707d;
    font-size:11px;
    margin-top:3px;
}

.mood{
    font-size:27px;
    margin:13px 0 8px;
}

.diary-text{
    white-space:pre-wrap;
    line-height:1.65;
    word-break:break-word;
}

.diary-img{
    width:100%;
    max-height:450px;
    object-fit:cover;
    border-radius:17px;
    margin-top:13px;
}

.delete{
    margin-top:12px;
    border:1px solid #442b34;
    color:#ff7189;
    background:#21171b;
    border-radius:9px;
    padding:7px 10px;
}

.empty{
    color:#6f6f7b;
    text-align:center;
    padding:30px;
}

.toast{
    position:fixed;
    z-index:100;
    left:50%;
    bottom:22px;
    transform:translate(-50%,100px);
    padding:12px 17px;
    border-radius:13px;
    background:#25252e;
    border:1px solid #3a3a46;
    transition:.25s;
}

.toast.show{
    transform:translate(-50%,0);
}

@media(max-width:500px){
    .container{padding:10px}
    .card{padding:14px}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="login">

<div class="login-box">

<div class="logo">❤️</div>

<h1>Nhật Ký Hai Người</h1>

<div class="sub">
Không gian riêng của hai người
</div>

<label>Tài khoản</label>
<input id="username" placeholder="Tài khoản">

<label>Mật khẩu</label>
<input id="password" type="password" placeholder="Mật khẩu">

<button class="main-btn" onclick="login()">
Đăng nhập ❤️
</button>

<div id="loginError" class="error"></div>

</div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="hidden">

<div class="top">

<div class="top-in">

<div class="brand">

<div class="brand-icon">❤️</div>

<div>
<div class="brand-name">Our Diary</div>
<div id="topUser" class="brand-user"></div>
</div>

</div>

<button class="logout" onclick="logout()">
Đăng xuất
</button>

</div>

</div>


<div class="container">


<!-- PEOPLE -->

<div class="card">

<div class="card-title">
💕 Hai người
</div>

<div class="people">

<div class="person">

<div class="person-icon">🧑</div>

<div id="meName" class="person-name">
Người 1
</div>

<div id="meNick" class="person-nick"></div>

</div>


<div class="person">

<div class="person-icon">👩</div>

<div id="otherName" class="person-name">
Người 2
</div>

<div id="otherNick" class="person-nick"></div>

</div>

</div>

</div>


<!-- WRITE -->

<div class="card">

<div class="card-title">
✍️ Ghi nhật ký
</div>

<label>Nội dung</label>

<textarea
id="content"
placeholder="Hôm nay bạn muốn viết gì...?"></textarea>


<label>Cảm xúc</label>

<select id="mood">
<option>❤️</option>
<option>🥰</option>
<option>😍</option>
<option>😊</option>
<option>😘</option>
<option>😂</option>
<option>🥺</option>
<option>😢</option>
<option>😡</option>
<option>😴</option>
<option>💔</option>
</select>


<label>📷 Ảnh đính kèm</label>

<input
id="photo"
type="file"
accept="image/*"
onchange="previewPhoto(event)">


<div id="preview" class="photo-preview">

<img id="previewImg">

<button
class="remove-photo"
onclick="removePhoto()">
×
</button>

</div>


<button
id="postBtn"
class="main-btn"
onclick="postDiary()">

❤️ Đăng nhật ký

</button>

</div>


<!-- NICKNAME -->

<div class="card">

<div class="card-title">
🥰 Đặt biệt danh cho người kia
</div>

<input
id="nickname"
placeholder="Ví dụ: Bé iu ❤️">

<button
class="main-btn"
onclick="saveNickname()">

Lưu biệt danh

</button>

</div>


<!-- DIARY -->

<div class="card">

<div class="card-title">
📖 Nhật ký chung
</div>

<div id="diaryList">
<div class="empty">
Đang tải...
</div>
</div>

</div>

</div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   1. SUPABASE
========================================================= */

const SUPABASE_URL =
"https://mmgqalltjkwpnxmfrajh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ce_O6R53zyBorjk9eF0tUg_XwstpHWk";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   2. TELEGRAM
=========================================================

   DÁN TOKEN BOT MỚI VÀO DÒNG DƯỚI.

   Ví dụ:
   const TELEGRAM_BOT_TOKEN =
   "123456:ABCDEF...";

========================================================= */

const TELEGRAM_BOT_TOKEN =
"8808731609:AAE-9c_fPqItcT3_hlQw0uFLhsduMcjSyJQ";

const TELEGRAM_CHAT_ID =
"-5515276053";


/* =========================================================
   3. BIẾN
========================================================= */

let currentUser = null;
let allUsers = [];
let realtime = null;


/* =========================================================
   4. LOGIN
========================================================= */

async function login(){

    const username =
    document.getElementById("username")
    .value.trim();

    const password =
    document.getElementById("password")
    .value;

    const error =
    document.getElementById("loginError");

    error.textContent="";

    if(!username || !password){

        error.textContent =
        "Nhập tài khoản và mật khẩu.";

        return;
    }

    try{

        const {data,error:err} =
        await db.rpc(
            "login_diary",
            {
                p_username:username,
                p_password:password
            }
        );

        if(err)
            throw err;

        if(!data || !data.length){

            throw new Error(
                "Sai tài khoản hoặc mật khẩu."
            );
        }

        currentUser=data[0];

        sessionStorage.setItem(
            "diaryUser",
            JSON.stringify(currentUser)
        );

        await start();

    }catch(e){

        console.error(e);

        error.textContent =
        e.message ||
        "Đăng nhập thất bại.";

    }
}


/* =========================================================
   5. START
========================================================= */

async function start(){

    document
    .getElementById("login")
    .classList.add("hidden");

    document
    .getElementById("app")
    .classList.remove("hidden");

    document
    .getElementById("topUser")
    .textContent =
    currentUser.display_name;

    await loadUsers();

    await loadNickname();

    await loadDiary();

    startRealtime();
}


/* =========================================================
   6. USERS
========================================================= */

async function loadUsers(){

    const {data,error} =
    await db.rpc(
        "get_diary_users"
    );

    if(error){

        console.error(error);

        allUsers=[currentUser];

        return;
    }

    allUsers=data || [];

    renderPeople();
}


function otherUser(){

    return allUsers.find(
        x =>
        x.id !== currentUser.id
    );
}


function renderPeople(){

    document
    .getElementById("meName")
    .textContent =
    currentUser.display_name;

    const other =
    otherUser();

    if(other){

        document
        .getElementById("otherName")
        .textContent =
        other.display_name;

    }

}


/* =========================================================
   7. NICKNAME
========================================================= */

async function loadNickname(){

    const other =
    otherUser();

    if(!other)
        return;

    const {data,error} =
    await db
    .from("diary_nicknames")
    .select("*")
    .eq(
        "owner_id",
        currentUser.id
    )
    .eq(
        "target_id",
        other.id
    )
    .maybeSingle();

    if(error){

        console.error(error);

        return;
    }

    if(data){

        document
        .getElementById("nickname")
        .value =
        data.nickname;

        document
        .getElementById("otherNick")
        .textContent =
        "💕 " + data.nickname;
    }
}


async function saveNickname(){

    const other =
    otherUser();

    if(!other){

        toast("Không tìm thấy người kia.");

        return;
    }

    const nickname =
    document
    .getElementById("nickname")
    .value.trim();

    if(!nickname){

        toast("Nhập biệt danh.");

        return;
    }

    const {error} =
    await db
    .from("diary_nicknames")
    .upsert(
        {
            owner_id:currentUser.id,
            target_id:other.id,
            nickname:nickname
        },
        {
            onConflict:
            "owner_id,target_id"
        }
    );

    if(error){

        console.error(error);

        toast(
            "Không lưu được biệt danh."
        );

        return;
    }

    document
    .getElementById("otherNick")
    .textContent =
    "💕 " + nickname;

    toast("Đã lưu biệt danh ❤️");
}


/* =========================================================
   8. PHOTO
========================================================= */

function previewPhoto(e){

    const file =
    e.target.files[0];

    if(!file)
        return;

    if(!file.type.startsWith("image/")){

        toast("Chỉ được chọn ảnh.");

        e.target.value="";

        return;
    }

    if(file.size > 10*1024*1024){

        toast("Ảnh tối đa 10MB.");

        e.target.value="";

        return;
    }

    document
    .getElementById("previewImg")
    .src =
    URL.createObjectURL(file);

    document
    .getElementById("preview")
    .style.display =
    "block";
}


function removePhoto(){

    document
    .getElementById("photo")
    .value="";

    document
    .getElementById("preview")
    .style.display =
    "none";

}


/* =========================================================
   9. POST DIARY
========================================================= */

async function postDiary(){

    const content =
    document
    .getElementById("content")
    .value.trim();

    const mood =
    document
    .getElementById("mood")
    .value;

    const file =
    document
    .getElementById("photo")
    .files[0];

    const btn =
    document
    .getElementById("postBtn");


    if(!content && !file){

        toast(
            "Viết nội dung hoặc chọn ảnh."
        );

        return;
    }

    btn.disabled=true;

    btn.textContent=
    "Đang đăng...";


    try{

        let imageUrl=null;


        /* UPLOAD */

        if(file){

            const ext =
            file.name
            .split(".")
            .pop()
            .toLowerCase();

            const path =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2) +
            "." +
            ext;


            const {error} =
            await db
            .storage
            .from("diary-images")
            .upload(
                path,
                file,
                {
                    contentType:
                    file.type
                }
            );

            if(error)
                throw error;


            const {data} =
            db
            .storage
            .from("diary-images")
            .getPublicUrl(path);

            imageUrl =
            data.publicUrl;
        }


        /* INSERT */

        const {data,error} =
        await db
        .from("diary_entries")
        .insert(
            {
                user_id:
                currentUser.id,

                content:
                content ||
                "📷 Đã gửi ảnh",

                mood:mood,

                image_url:
                imageUrl
            }
        )
        .select()
        .single();


        if(error)
            throw error;


        /* TELEGRAM */

        await sendTelegram(data);


        /* CLEAR */

        document
        .getElementById("content")
        .value="";

        removePhoto();

        toast(
            "Đã đăng nhật ký ❤️"
        );


    }catch(e){

        console.error(e);

        toast(
            "Lỗi: " +
            (e.message || e)
        );

    }finally{

        btn.disabled=false;

        btn.textContent=
        "❤️ Đăng nhật ký";
    }
}


/* =========================================================
   10. TELEGRAM
========================================================= */

async function sendTelegram(entry){

    if(
        !TELEGRAM_BOT_TOKEN ||
        TELEGRAM_BOT_TOKEN ===
        "DAN_TOKEN_BOT_MOI_VAO_DAY"
    ){

        console.warn(
            "Chưa có Telegram Bot Token."
        );

        return;
    }


    const text =
`📝 NHẬT KÝ MỚI ❤️

👤 ${currentUser.display_name}

${entry.mood || "❤️"}

${entry.content || ""}

━━━━━━━━━━━━
📖 Our Diary`;


    let response;


    if(entry.image_url){

        response =
        await fetch(
            "https://api.telegram.org/bot" +
            TELEGRAM_BOT_TOKEN +
            "/sendPhoto",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(
                    {
                        chat_id:
                        TELEGRAM_CHAT_ID,

                        photo:
                        entry.image_url,

                        caption:
                        text
                    }
                )
            }
        );

    }else{

        response =
        await fetch(
            "https://api.telegram.org/bot" +
            TELEGRAM_BOT_TOKEN +
            "/sendMessage",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(
                    {
                        chat_id:
                        TELEGRAM_CHAT_ID,

                        text:text
                    }
                )
            }
        );

    }


    const result =
    await response.json();


    console.log(
        "TELEGRAM:",
        result
    );


    if(!result.ok){

        throw new Error(
            "Telegram: " +
            result.description
        );
    }
}


/* =========================================================
   11. LOAD DIARY
========================================================= */

async function loadDiary(){

    const {data,error} =
    await db
    .from("diary_entries")
    .select("*")
    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        console.error(error);

        document
        .getElementById("diaryList")
        .innerHTML =
        `<div class="empty">
            Không tải được nhật ký.
        </div>`;

        return;
    }

    renderDiary(
        data || []
    );
}


/* =========================================================
   12. RENDER
========================================================= */

function renderDiary(entries){

    const box =
    document
    .getElementById("diaryList");


    if(!entries.length){

        box.innerHTML =
        `<div class="empty">
            Chưa có ghi chú nào ❤️
        </div>`;

        return;
    }


    box.innerHTML="";


    entries.forEach(entry=>{

        const user =
        allUsers.find(
            x =>
            x.id === entry.user_id
        );


        const name =
        user?.display_name ||
        "Người dùng";


        const time =
        new Date(
            entry.created_at
        ).toLocaleString(
            "vi-VN",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


        const div =
        document.createElement("div");

        div.className="diary";


        div.innerHTML=`

        <div class="diary-head">

            <div class="author">

                <div class="avatar">
                    ❤️
                </div>

                <div>

                    <div class="author-name">
                        ${safe(name)}
                    </div>

                    <div class="time">
                        ${time}
                    </div>

                </div>

            </div>

        </div>


        <div class="mood">
            ${safe(entry.mood || "❤️")}
        </div>


        <div class="diary-text">
            ${safe(entry.content || "")}
        </div>


        ${
            entry.image_url
            ?
            `
            <img
                class="diary-img"
                src="${safe(entry.image_url)}"
                onclick="window.open(
                    '${safe(entry.image_url)}',
                    '_blank'
                )">
            `
            :
            ""
        }


        ${
            entry.user_id === currentUser.id
            ?
            `
            <button
                class="delete"
                onclick="deleteDiary(
                    '${entry.id}'
                )">

                🗑 Xóa

            </button>
            `
            :
            ""
        }

        `;


        box.appendChild(div);

    });
}


/* =========================================================
   13. DELETE
========================================================= */

async function deleteDiary(id){

    if(
        !confirm(
            "Xóa ghi chú này?"
        )
    )
        return;


    const {error} =
    await db
    .from("diary_entries")
    .delete()
    .eq("id",id)
    .eq(
        "user_id",
        currentUser.id
    );


    if(error){

        toast(
            "Không thể xóa."
        );

        console.error(error);

        return;
    }


    toast("Đã xóa.");

    loadDiary();
}


/* =========================================================
   14. REALTIME
========================================================= */

function startRealtime(){

    if(realtime){

        db.removeChannel(
            realtime
        );
    }


    realtime =
    db
    .channel(
        "diary-realtime"
    )
    .on(
        "postgres_changes",
        {
            event:"*",
            schema:"public",
            table:"diary_entries"
        },
        ()=>{
            loadDiary();
        }
    )
    .subscribe();
}


/* =========================================================
   15. LOGOUT
========================================================= */

function logout(){

    if(realtime){

        db.removeChannel(
            realtime
        );

    }

    sessionStorage.removeItem(
        "diaryUser"
    );

    location.reload();
}


/* =========================================================
   16. TOAST
========================================================= */

let toastTimer;

function toast(message){

    const box =
    document.getElementById("toast");

    box.textContent=message;

    box.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
    setTimeout(
        ()=>{
            box.classList.remove("show");
        },
        2500
    );
}


/* =========================================================
   17. ESCAPE
========================================================= */

function safe(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   18. AUTO LOGIN
========================================================= */

(async()=>{

    const saved =
    sessionStorage.getItem(
        "diaryUser"
    );

    if(!saved)
        return;

    try{

        currentUser =
        JSON.parse(saved);

        await start();

    }catch(e){

        sessionStorage.removeItem(
            "diaryUser"
        );

    }

})();


/* ENTER */

document
.getElementById("password")
.addEventListener(
    "keydown",
    e=>{
        if(e.key==="Enter")
            login();
    }
);

</script>
