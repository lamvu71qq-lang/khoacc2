<<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Nhật Ký Hai Người ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08080c;color:#fff}
body{background:radial-gradient(circle at 0 0,#35152d 0,transparent 35%),radial-gradient(circle at 100% 0,#152442 0,transparent 35%),#08080c}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.wrap{width:min(760px,100%);margin:auto;padding:12px}
.card{background:rgba(19,19,27,.92);border:1px solid #30303b;border-radius:22px;padding:17px;margin-bottom:12px;box-shadow:0 15px 50px #0005}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.login .card{width:min(420px,100%);padding:25px}
.logo{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;margin:0 auto 14px;font-size:36px;background:linear-gradient(135deg,#ff4c98,#775cff)}
h1{font-size:25px;text-align:center;margin:0}.muted{color:#858591;font-size:13px;text-align:center;margin:8px 0 22px}
label{display:block;color:#aaa;font-size:13px;margin:0 0 7px}
input,textarea,select{width:100%;border:1px solid #363641;background:#111119;color:#fff;border-radius:14px;padding:13px;outline:none;margin-bottom:13px}
textarea{min-height:125px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#ff5b9f}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#ff4c98,#775cff);color:#fff;font-weight:800}
.err{color:#ff7389;text-align:center;min-height:20px;font-size:13px;margin-top:8px}
.top{position:sticky;top:0;z-index:20;background:#08080cdc;backdrop-filter:blur(18px);border-bottom:1px solid #292933}
.topin{width:min(760px,100%);margin:auto;padding:10px 13px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}.brandIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#ff4c98,#775cff)}
.brandTitle{font-weight:900}.brandSub{font-size:12px;color:#ff6cac;margin-top:2px}
.out{border:1px solid #363641;background:#17171f;color:#aaa;padding:9px 11px;border-radius:11px}
.title{font-size:17px;font-weight:900;margin-bottom:13px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{background:#17171f;border:1px solid #2d2d38;border-radius:17px;padding:14px}
.picon{font-size:25px}.pname{font-weight:900;margin-top:7px}.psub{font-size:12px;color:#ff6cac;margin-top:3px}
.preview{display:none;position:relative;margin:0 0 13px}.preview img{width:100%;max-height:380px;object-fit:cover;border-radius:16px;display:block}
.remove{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:#000b;color:#fff;font-size:22px}
.diary{background:#17171f;border:1px solid #2d2d38;border-radius:18px;padding:15px;margin-bottom:10px}
.head{display:flex;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#ff4c98,#775cff)}
.author{font-weight:900}.time{font-size:11px;color:#777784;margin-top:3px}.mood{font-size:25px;margin:11px 0 6px}.content{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.photo{width:100%;max-height:460px;object-fit:cover;border-radius:15px;display:block;margin-top:11px}
.delete{margin-top:10px;border:1px solid #4a2d37;background:#21171b;color:#ff778d;border-radius:10px;padding:7px 10px}
.empty{text-align:center;color:#777784;padding:24px 8px}
.toast{position:fixed;z-index:100;left:50%;bottom:22px;transform:translate(-50%,150px);transition:.25s;background:#25252e;border:1px solid #3b3b47;padding:12px 16px;border-radius:13px;max-width:90%;text-align:center}.toast.show{transform:translate(-50%,0)}
.small{font-size:12px;color:#777784;margin-top:-4px;margin-bottom:12px}
</style>
</head>
<body>

<section id="loginPage" class="login">
  <div class="card">
    <div class="logo">❤️</div>
    <h1>Nhật Ký Hai Người</h1>
    <div class="muted">Đăng nhập để viết và xem nhật ký chung</div>
    <label>Tài khoản</label>
    <input id="loginUser" autocomplete="username" placeholder="user1">
    <label>Mật khẩu</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••">
    <button id="loginBtn" class="btn">Đăng nhập ❤️</button>
    <div id="loginErr" class="err"></div>
  </div>
</section>

<section id="appPage" class="hidden">
  <header class="top">
    <div class="topin">
      <div class="brand">
        <div class="brandIcon">❤️</div>
        <div><div class="brandTitle">Our Diary</div><div id="brandSub" class="brandSub"></div></div>
      </div>
      <button id="logoutBtn" class="out">Đăng xuất</button>
    </div>
  </header>

  <main class="wrap">
    <div class="card">
      <div class="title">💕 Hai người</div>
      <div id="people" class="people"></div>
    </div>

    <div class="card">
      <div class="title">✍️ Ghi nhật ký</div>
      <label>Nội dung</label>
      <textarea id="entryText" placeholder="Viết điều bạn muốn lưu lại..."></textarea>
      <label>Cảm xúc</label>
      <select id="entryMood">
        <option>❤️</option><option>🥰</option><option>😍</option><option>😊</option>
        <option>😘</option><option>😂</option><option>🥺</option><option>😢</option>
        <option>😡</option><option>😴</option><option>💔</option>
      </select>
      <label>📷 Ảnh đính kèm</label>
      <input id="entryFile" type="file" accept="image/*">
      <div id="preview" class="preview">
        <img id="previewImg">
        <button class="remove" type="button" id="removePhoto">×</button>
      </div>
      <button id="postBtn" class="btn">❤️ Đăng nhật ký</button>
    </div>

    <div class="card">
      <div class="title">🥰 Đặt biệt danh cho người kia</div>
      <div id="nicknameInfo" class="small"></div>
      <input id="nicknameInput" placeholder="Ví dụ: Bé iu ❤️">
      <button id="nicknameBtn" class="btn">Lưu biệt danh</button>
    </div>

    <div class="card">
      <div class="title">📖 Nhật ký chung</div>
      <div id="diaryList"><div class="empty">Đang tải...</div></div>
    </div>
  </main>
</section>

<div id="toast" class="toast"></div>

<script>
/* =====================================================
   SUPABASE
   ===================================================== */
const SUPABASE_URL = "https://mmgqalltjkwpnxmfrajh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ce_O6R53zyBorjk9eF0tUg_XwstpHWk";
const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* =====================================================
   TELEGRAM
   CHỈ CÓ 1 CHỖ DÁN TOKEN
   ===================================================== */
const TELEGRAM_BOT_TOKEN = "8503723223:AAF8FonAHhyHUz7vKmy-7K7sBPqYJUJlCwo";
const TELEGRAM_CHAT_ID = "-5515276053";

/* ===================================================== */
let me = null;
let allUsers = [];
let myNicknames = {};
let realtimeChannel = null;

const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(text){
  const el=$("toast");
  el.textContent=text;
  el.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.classList.remove("show"),2500);
}

function nameOf(user){
  if(!user) return "Người dùng";
  return myNicknames[user.id] || user.display_name || user.username || "Người dùng";
}

async function login(){
  const username=$("loginUser").value.trim();
  const password=$("loginPass").value;
  $("loginErr").textContent="";
  if(!username || !password){
    $("loginErr").textContent="Vui lòng nhập đủ tài khoản và mật khẩu.";
    return;
  }

  $("loginBtn").disabled=true;
  $("loginBtn").textContent="Đang đăng nhập...";

  try{
    const {data,error}=await supabaseClient.rpc("login_diary",{
      p_username:username,
      p_password:password
    });
    if(error) throw error;
    if(!data || !data.length) throw new Error("Sai tài khoản hoặc mật khẩu.");

    me=data[0];
    sessionStorage.setItem("diary_current_user",JSON.stringify(me));
    await openApp();
  }catch(err){
    console.error(err);
    $("loginErr").textContent=err.message || "Đăng nhập thất bại.";
  }finally{
    $("loginBtn").disabled=false;
    $("loginBtn").textContent="Đăng nhập ❤️";
  }
}

async function openApp(){
  $("loginPage").classList.add("hidden");
  $("appPage").classList.remove("hidden");
  try{
    await loadUsers();
    await loadNicknames();
    renderPeople();
    await loadEntries();
    subscribeRealtime();
  }catch(err){
    console.error(err);
    toast("Không tải được dữ liệu: "+err.message);
  }
}

async function loadUsers(){
  // Dùng RPC SECURITY DEFINER để không bị RLS chỉ cho thấy chính mình.
  const {data,error}=await supabaseClient.rpc("get_diary_users");
  if(error) throw error;
  allUsers=data || [];
}

async function loadNicknames(){
  const {data,error}=await supabaseClient
    .from("diary_nicknames")
    .select("owner_id,target_id,nickname")
    .eq("owner_id",me.id);
  if(error) throw error;
  myNicknames={};
  (data||[]).forEach(row=>myNicknames[row.target_id]=row.nickname);
}

function renderPeople(){
  $("brandSub").textContent=nameOf(me);
  $("people").innerHTML=allUsers.map(user=>{
    const mine=user.id===me.id;
    return `<div class="person">
      <div class="picon">${mine?"🧑":"👩"}</div>
      <div class="pname">${escapeHTML(nameOf(user))}</div>
      <div class="psub">${mine?"Bạn":"Người kia"}</div>
    </div>`;
  }).join("");

  const other=allUsers.find(u=>String(u.id)!==String(me.id));
  $("nicknameInfo").textContent=other
    ? "Bạn đang đặt biệt danh cho: "+(other.display_name || other.username || "Người kia")
    : "Chưa tìm thấy người thứ hai. Hãy chạy SQL sửa database bên dưới.";
}

async function saveNickname(){
  const other=allUsers.find(u=>String(u.id)!==String(me.id));
  if(!other){
    toast("Chưa tải được người thứ 2. Hãy chạy SQL sửa database.");
    return;
  }
  const nickname=$("nicknameInput").value.trim();
  if(!nickname){toast("Hãy nhập biệt danh.");return;}

  const {error}=await supabaseClient.from("diary_nicknames").upsert({
    owner_id:me.id,
    target_id:other.id,
    nickname:nickname,
    updated_at:new Date().toISOString()
  },{onConflict:"owner_id,target_id"});

  if(error){console.error(error);toast("Lỗi lưu biệt danh: "+error.message);return;}

  myNicknames[other.id]=nickname;
  renderPeople();
  $("nicknameInput").value="";
  toast("Đã lưu biệt danh ❤️");
}

$("entryFile").addEventListener("change",function(){
  const file=this.files[0];
  if(!file){removePhoto();return;}
  if(!file.type.startsWith("image/")){
    toast("File phải là ảnh.");
    this.value="";
    return;
  }
  if(file.size>10*1024*1024){
    toast("Ảnh tối đa 10MB.");
    this.value="";
    return;
  }
  $("previewImg").src=URL.createObjectURL(file);
  $("preview").style.display="block";
});

function removePhoto(){
  $("entryFile").value="";
  $("previewImg").removeAttribute("src");
  $("preview").style.display="none";
}

async function uploadImage(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=me.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;

  const {error}=await supabaseClient.storage
    .from("diary-images")
    .upload(path,file,{contentType:file.type,upsert:false});

  if(error) throw error;

  const {data}=supabaseClient.storage.from("diary-images").getPublicUrl(path);
  return data.publicUrl;
}

async function postEntry(){
  const content=$("entryText").value.trim();
  const mood=$("entryMood").value;
  const file=$("entryFile").files[0];

  if(!content && !file){toast("Hãy viết nội dung hoặc chọn ảnh.");return;}

  $("postBtn").disabled=true;
  $("postBtn").textContent="Đang đăng...";

  try{
    let image_url=null;
    if(file) image_url=await uploadImage(file);

    const {error}=await supabaseClient.from("diary_entries").insert({
      user_id:me.id,
      content:content,
      mood:mood,
      image_url:image_url
    });
    if(error) throw error;

    $("entryText").value="";
    removePhoto();
    toast("Đã đăng nhật ký ❤️");

    /* Chỉ báo: [biệt danh] đã up ghi chú */
    sendTelegramNotification().catch(err=>console.error("Telegram:",err));
  }catch(err){
    console.error(err);
    toast("Lỗi đăng nhật ký: "+err.message);
  }finally{
    $("postBtn").disabled=false;
    $("postBtn").textContent="❤️ Đăng nhật ký";
  }
}

async function sendTelegramNotification(){
  if(!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN==="DÁN_TOKEN_BOT_MỚI_VÀO_ĐÂY"){
    console.warn("Chưa nhập TELEGRAM_BOT_TOKEN.");
    return;
  }

  const text="❤️ "+nameOf(me)+" đã up ghi chú";

  const response=await fetch(
    "https://api.telegram.org/bot"+TELEGRAM_BOT_TOKEN+"/sendMessage",
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        chat_id:TELEGRAM_CHAT_ID,
        text:text
      })
    }
  );

  const result=await response.json();
  if(!result.ok) throw new Error(result.description || "Telegram API lỗi");
}

async function loadEntries(){
  const {data,error}=await supabaseClient
    .from("diary_entries")
    .select("id,user_id,content,mood,image_url,created_at")
    .order("created_at",{ascending:false});

  if(error) throw error;

  $("diaryList").innerHTML="";
  if(!data || !data.length){
    $("diaryList").innerHTML='<div class="empty">Chưa có ghi chú nào ❤️</div>';
    return;
  }

  data.forEach(entry=>{
    const user=allUsers.find(u=>u.id===entry.user_id);
    const time=new Date(entry.created_at).toLocaleString("vi-VN",{
      day:"2-digit",month:"2-digit",year:"numeric",
      hour:"2-digit",minute:"2-digit"
    });

    const el=document.createElement("div");
    el.className="diary";
    el.innerHTML=`
      <div class="head">
        <div class="avatar">❤️</div>
        <div>
          <div class="author">${escapeHTML(nameOf(user))}</div>
          <div class="time">${escapeHTML(time)}</div>
        </div>
      </div>
      <div class="mood">${escapeHTML(entry.mood||"❤️")}</div>
      ${entry.content?`<div class="content">${escapeHTML(entry.content)}</div>`:""}
      ${entry.image_url?`<img class="photo" src="${escapeHTML(entry.image_url)}" loading="lazy">`:""}
      ${entry.user_id===me.id?`<button class="delete" data-id="${escapeHTML(entry.id)}">🗑 Xóa</button>`:""}
    `;
    $("diaryList").appendChild(el);
  });

  document.querySelectorAll(".delete").forEach(btn=>{
    btn.addEventListener("click",()=>deleteEntry(btn.dataset.id));
  });
}

async function deleteEntry(id){
  if(!confirm("Xóa ghi chú này?"))return;
  const {error}=await supabaseClient
    .from("diary_entries")
    .delete()
    .eq("id",id)
    .eq("user_id",me.id);
  if(error){toast("Không thể xóa: "+error.message);return;}
  toast("Đã xóa.");
  await loadEntries();
}

function subscribeRealtime(){
  if(realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

  realtimeChannel=supabaseClient
    .channel("diary-live")
    .on("postgres_changes",
      {event:"*",schema:"public",table:"diary_entries"},
      ()=>loadEntries().catch(console.error))
    .on("postgres_changes",
      {event:"*",schema:"public",table:"diary_nicknames"},
      async()=>{
        try{
          await loadNicknames();
          renderPeople();
          await loadEntries();
        }catch(e){console.error(e);}
      })
    .subscribe();
}

function logout(){
  if(realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
  sessionStorage.removeItem("diary_current_user");
  location.reload();
}

$("loginBtn").addEventListener("click",login);
$("logoutBtn").addEventListener("click",logout);
$("postBtn").addEventListener("click",postEntry);
$("nicknameBtn").addEventListener("click",saveNickname);
$("removePhoto").addEventListener("click",removePhoto);

$("loginPass").addEventListener("keydown",e=>{
  if(e.key==="Enter")login();
});

(async function(){
  const saved=sessionStorage.getItem("diary_current_user");
  if(!saved)return;
  try{
    me=JSON.parse(saved);
    await openApp();
  }catch(e){
    console.error(e);
    sessionStorage.removeItem("diary_current_user");
  }
})();
</script>
</body>
</html>
