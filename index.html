<!DOCTYPE html>

<style>
*{box-sizing:border-box}

body{

/* MODAL */

.modal{

@media(min-width:700px){

input,textarea,select{

label{

/* ADMIN */

.admin-page{

}

.admin-page.show{

}

.admin-card{

}

}

}

.product-admin{
    display:flex;
    gap:12px;

    border-bottom:1px solid #eee;
}

.product-admin img{
    width:75px;
    height:75px;
    border-radius:10px;
    object-fit:cover;
}

.product-admin-info{
    flex:1;
}

.product-admin-name{
    font-weight:800;
}

.product-admin-price{
    color:#ff5722;
    font-weight:800;
    margin:4px 0;
}

.delete{
    border:0;
    background:#ffe5e5;
    color:#d00;
    padding:8px 10px;
    border-radius:9px;
    font-weight:700;
}

.admin-nav{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.admin-nav button{
    flex:1;
    border:0;
    padding:11px;
    border-radius:10px;
    background:#eee;
    font-weight:800;
}

.admin-nav button.active{
    background:#ff5722;
    color:white;
}

.success{
    text-align:center;
    padding:20px;
}

.order-code{
    color:#ff5722;
    font-size:28px;
    font-weight:900;
    margin:15px 0;
}
</style>
</head>

<body>

<header>
    <div class="header">

        <div class="logo">
            🍔 FOOD ORDER
        </div>

        <div>
            <button onclick="openCart()">
                🛒 <span id="cartCount">0</span>
            </button>

            </button>

    </div>
</header>


<!-- ================= KHÁCH ================= -->

<div id="customerPage">

<div class="container">

    <div class="banner">
        <h1>Đặt món ngay 🍽️</h1>
        <div>Ngon - nhanh - tiện lợi</div>
    </div>

    <div class="categories">

        <button class="cat active"
                onclick="changeCategory('all',this)">
            🍽️ Tất cả
        </button>

        <button class="cat"
                onclick="changeCategory('main',this)">

        </button>

                onclick="changeCategory('snack',this)">

        </button>

        <button class="cat"
                onclick="changeCategory('extra',this)">
            🧀 Đồ ăn thêm

                onclick="changeCategory('drink',this)">

    </div>

    <div class="section-title" id="sectionTitle">
        Tất cả món
    </div>

    <div id="foodList"></div>

</div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage" class="admin-page">

<div class="container">

    <div class="admin-card">

        <div class="admin-title">
            ⚙️ Quản lý món ăn
        </div>

        <div class="admin-sub">
            Thêm món mới để hiển thị cho khách.
        </div>

        <label>Tên món</label>

        <input
            id="adminName"
            placeholder="Ví dụ: Cơm sườn">

        <label>Giá</label>

        <input
            id="adminPrice"
            type="number"
            placeholder="45000">

        <label>Danh mục</label>

        <select id="adminCategory">

            <option value="main">
                🍚 Ăn chính
            </option>

            <option value="snack">

        </select>

                onclick="closeModal('cartModal')">

        </button>

    </div>

    <div id="cartItems"></div>

    <div class="total">

        <span>Tổng</span>

        <span id="cartTotal">
            0đ
        </span>

    </div>

    <button
        class="primary"

        Tiếp tục đặt hàng

    </button>

</div>

</div>


<!-- ================= CHECKOUT ================= -->

<div class="modal" id="checkoutModal">

<div class="modal-box">

    <div class="modal-head">

        <div class="modal-title">
            📦 Thông tin giao hàng
        </div>

        <button class="close"
                onclick="closeModal('checkoutModal')">
            ×
        </button>

    </div>

    <label>Họ tên</label>

    <input
        id="customerName"
        placeholder="Nguyễn Văn A">

    <label>Số điện thoại</label>

        id="customerPhone"

    <label>Địa chỉ</label>

    <textarea

        placeholder="Địa chỉ giao hàng"></textarea>

    <label>Thanh toán</label>

    <select id="payment">

        <option value="COD">

<div class="modal" id="successModal">

            🎉
        </div>

        <h2>
            Đặt hàng thành công!
        </h2>

        <div>
            Mã đơn:
        </div>

        <div class="order-code"
             id="orderCode">
        </div>

        <button
            class="primary"
            onclick="location.reload()">

            Về trang chủ

        </button>

    </div>

</div>

</div>


<script>

/* ================= MÓN MẶC ĐỊNH ================= */

const defaultFoods = [

{
    id:1,
    name:"Cơm Gà Chiên",
    price:45000,
    category:"main",
    desc:"Cơm trắng + gà chiên giòn",
    img:"https://images.unsplash.com/photo-1512058564366-18510be2db19?w=900"
},

{
    id:2,
    name:"Mì Xào Bò",
    price:50000,
    category:"main",
    desc:"Mì xào bò và rau củ",
    img:"https://images.unsplash.com/photo-1557872943-16a5ac26437e?w=900"
},

{
    id:3,
    name:"Khoai Tây Chiên",
    price:25000,
    category:"snack",
    desc:"Khoai tây chiên giòn",
    img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=900"
},

{
    id:4,
    name:"Xúc Xích",
    price:20000,
    category:"snack",
    desc:"Xúc xích chiên",
    img:"https://images.unsplash.com/photo-1612392062631-94dd858cba88?w=900"
},

{
    id:5,
    name:"Trứng Ốp La",
    price:10000,
    category:"extra",
    desc:"Thêm 1 trứng ốp la",
    img:"https://images.unsplash.com/photo-1525351484163-7529414344d8?w=900"
},

{
    id:6,
    name:"Thêm Phô Mai",
    price:15000,
    category:"extra",
    desc:"Thêm phô mai",
    img:"https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=900"
},

{
    id:7,
    name:"Coca Cola",
    price:15000,
    category:"drink",
    desc:"Coca Cola mát lạnh",
    img:"https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=900"
},

{
    id:8,
    name:"Trà Đào",
    price:25000,
    category:"drink",
    desc:"Trà đào thơm mát",
    img:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=900"
}

];


/* ================= LOAD DATA ================= */

let foods =
    JSON.parse(
        localStorage.getItem("foods")
    ) || defaultFoods;


/* ================= CART ================= */

let cart = [];


/* ================= MONEY ================= */

function money(number){

    return Number(number)
        .toLocaleString("vi-VN") + "đ";

}


/* ================= SAVE FOOD ================= */

function saveFoods(){

    localStorage.setItem(
        "foods",
        JSON.stringify(foods)
    );

}


/* ================= RENDER FOOD ================= */

function renderFoods(category="all"){

    const box =
        document.getElementById("foodList");

    let list = foods;

    if(category !== "all"){

        list =
            foods.filter(
                item => item.category === category
            );

    }

    if(!list.length){

        box.innerHTML =
            `<div class="empty">
                Chưa có món trong mục này.
             </div>`;

        return;

    }

    box.innerHTML =
        list.map(food => `

        <div class="food">

            <img
                class="food-img"
                src="${food.img}"
                onerror="this.style.display='none'"
            >

            <div class="food-content">

                <div class="food-name">
                    ${escapeHtml(food.name)}
                </div>

                <div class="food-desc">
                    ${escapeHtml(food.desc || "")}
                </div>

                <div class="food-bottom">

                    <div class="price">
                        ${money(food.price)}
                    </div>

                    <button
                        class="add"
                        onclick="addToCart(${food.id})">

                        + Thêm

                    </button>

                </div>

            </div>

        </div>

    `).join("");

}


/* ================= CATEGORY ================= */

function changeCategory(category,button){

    document
        .querySelectorAll(".cat")
        .forEach(
            x => x.classList.remove("active")
        );

    button.classList.add("active");

    const titles = {

        all:"Tất cả món",
        main:"🍚 Ăn chính",
        snack:"🍟 Ăn vặt",
        extra:"🧀 Đồ ăn thêm",
        drink:"🥤 Đồ uống"

    };

    document.getElementById("sectionTitle")
        .textContent = titles[category];

    renderFoods(category);

}


/* ================= ADD CART ================= */

function addToCart(id){

    const food =
        foods.find(
            item => item.id === id
        );

    if(!food) return;

    const item =
        cart.find(
            item => item.id === id
        );

    if(item){

        item.qty++;

    }else{

        cart.push({
            ...food,
            qty:1
        });

    }

    updateCart();

}


/* ================= CART ================= */

function updateCart(){

    const count =
        cart.reduce(
            (sum,item)=>sum+item.qty,
            0
        );

    const total =
        cart.reduce(
            (sum,item)=>
                sum + item.price * item.qty,
            0
        );

    document.getElementById("cartCount")
        .textContent = count;

    document.getElementById("bottomTotal")
        ?.remove();

}


function openCart(){

    renderCart();

    document
        .getElementById("cartModal")
        .classList.add("show");

}


function renderCart(){

    const box =
        document.getElementById("cartItems");

    if(!cart.length){

        box.innerHTML =
            `<div class="empty">
                🛒 Giỏ hàng trống
             </div>`;

        document.getElementById("cartTotal")
            .textContent="0đ";

        return;

    }

    box.innerHTML =
        cart.map(item => `

        <div class="cart-item">

            <div>

                <div class="cart-name">
                    ${escapeHtml(item.name)}
                </div>

                <div class="cart-price">
                    ${money(item.price)}
                </div>

            </div>

            <div class="qty">

                <button
                    onclick="changeQty(${item.id},-1)">
                    −
                </button>

                <b>
                    ${item.qty}
                </b>

                <button
                    onclick="changeQty(${item.id},1)">
                    +
                </button>

            </div>

        </div>

    `).join("");

    const total =
        cart.reduce(
            (sum,item)=>
                sum + item.price * item.qty,
            0
        );

    document.getElementById("cartTotal")
        .textContent = money(total);

}


function changeQty(id,amount){

    const item =
        cart.find(
            x => x.id === id
        );

    if(!item) return;

    item.qty += amount;

    if(item.qty <= 0){

        cart =
            cart.filter(
                x => x.id !== id
            );

    }

    updateCart();

    renderCart();

}


/* ================= CHECKOUT ================= */

function openCheckout(){

    if(!cart.length){

        alert("Giỏ hàng đang trống!");

        return;

    }

    closeModal("cartModal");

    document
        .getElementById("checkoutModal")
        .classList.add("show");

}


function placeOrder(){

    const name =
        document
            .getElementById("customerName")
            .value.trim();

    const phone =
        document
            .getElementById("customerPhone")
            .value.trim();

    const address =
        document
            .getElementById("customerAddress")
            .value.trim();

    const payment =
        document
            .getElementById("payment")
            .value;

    if(!name || !phone || !address){

        alert("Vui lòng nhập đầy đủ thông tin!");

        return;

    }

    const total =
        cart.reduce(
            (sum,item)=>
                sum + item.price * item.qty,
            0
        );

    const order = {

        id:
            "OD" +
            Date.now()
                .toString()
                .slice(-7),

        customer:{
            name,
            phone,
            address
        },

        payment,

        items:JSON.parse(
            JSON.stringify(cart)
        ),

        total,

        status:"Chờ xác nhận",

        createdAt:
            new Date()
                .toLocaleString("vi-VN")

    };

    const orders =
        JSON.parse(
            localStorage.getItem("orders") || "[]"
        );

    orders.push(order);

    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );

    document.getElementById("orderCode")
        .textContent = order.id;

    closeModal("checkoutModal");

    document
        .getElementById("successModal")
        .classList.add("show");

    cart=[];

    updateCart();

}


/* ================= ADMIN ================= */

function openAdmin(){

    document
        .getElementById("customerPage")
        .style.display="none";

    document
        .getElementById("adminPage")
        .classList.add("show");

    renderAdminFoods();

}


function closeAdmin(){

    document
        .getElementById("adminPage")
        .classList.remove("show");

    document
        .getElementById("customerPage")
        .style.display="block";

    renderFoods();

}


/* ================= ADD FOOD ================= */

function addFood(){

    const name =
        document
            .getElementById("adminName")
            .value.trim();

    const price =
        Number(
            document
                .getElementById("adminPrice")
                .value
        );

    const category =
        document
            .getElementById("adminCategory")
            .value;

    const desc =
        document
            .getElementById("adminDesc")
            .value.trim();

    const img =
        document
            .getElementById("adminImg")
            .value.trim();


    if(!name){

        alert("Nhập tên món!");

        return;

    }

    if(!price || price <= 0){

        alert("Nhập giá hợp lệ!");

        return;

    }


    const newFood = {

        id:
            Date.now(),

        name:name,

        price:price,

        category:category,

        desc:desc || "Món ăn ngon",

        img:
            img ||
            "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=900"

    };


    foods.push(newFood);

    saveFoods();

    document.getElementById("adminName")
        .value="";

    document.getElementById("adminPrice")
        .value="";

    document.getElementById("adminDesc")
        .value="";

    document.getElementById("adminImg")
        .value="";


    renderAdminFoods();

    renderFoods();

    alert("Đã thêm món!");

}


/* ================= ADMIN LIST ================= */

function renderAdminFoods(){

    const box =
        document.getElementById("adminFoodList");

    if(!foods.length){

        box.innerHTML =
            `<div class="empty">
                Chưa có món.
             </div>`;

        return;

    }

    box.innerHTML =
        foods.map(food => `

        <div class="product-admin">

            <img
                src="${food.img}"
                onerror="this.style.display='none'"
            >

            <div class="product-admin-info">

                <div class="product-admin-name">
                    ${escapeHtml(food.name)}
                </div>

                <div class="product-admin-price">
                    ${money(food.price)}
                </div>

                <div style="font-size:13px;color:#777">
                    ${categoryName(food.category)}
                </div>

            </div>

            <button
                class="delete"
                onclick="deleteFood(${food.id})">

                Xóa

            </button>

        </div>

    `).join("");

}


/* ================= DELETE ================= */

function deleteFood(id){

    const food =
        foods.find(
            item => item.id === id
        );

    if(!food) return;

    if(!confirm(
        `Xóa món "${food.name}"?`
    )) return;

    foods =
        foods.filter(
            item => item.id !== id
        );

    saveFoods();

    renderAdminFoods();

    renderFoods();

}


/* ================= CATEGORY NAME ================= */

function categoryName(category){

    const names = {

        main:"🍚 Ăn chính",
        snack:"🍟 Ăn vặt",
        extra:"🧀 Đồ ăn thêm",
        drink:"🥤 Đồ uống"

    };

    return names[category] || category;

}


/* ================= ESCAPE ================= */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ================= MODAL ================= */

function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}


document
    .querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener(
            "click",
            function(e){

                if(e.target === modal){

                    modal.classList.remove("show");

                }

            }
        );

    });


/* ================= START ================= */

updateCart();
