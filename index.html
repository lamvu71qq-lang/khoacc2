<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Diary</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#09090d;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px
}
.box{
 width:100%;max-width:430px;background:#12121a;
 border:1px solid #30303c;border-radius:28px;padding:28px
}
.logo{text-align:center;font-size:65px}
.title{text-align:center;font-size:30px;font-weight:900;margin:10px 0 25px}

header{
 position:sticky;top:0;z-index:20;
 display:flex;justify-content:space-between;align-items:center;
 padding:15px 18px;background:rgba(10,10,15,.94);
 backdrop-filter:blur(15px);
 border-bottom:1px solid #292934
}
.brand{display:flex;gap:10px;align-items:center}
.brandIcon{
 width:48px;height:48px;border-radius:15px;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#f33d9e,#7652ff);
 font-size:25px
}
.brandName{font-weight:900;font-size:20px}
.brandUser{font-size:13px;color:#ff65b4}

.container{max-width:850px;margin:auto;padding:20px 15px 70px}

.card{
 background:#12121a;border:1px solid #30303c;
 border-radius:25px;padding:21px;margin-bottom:18px
}

h2{margin:0 0 18px}
label{display:block;color:#aaa;margin:13px 0 7px}

input,textarea{
 width:100%;background:#0d0d14;color:#fff;
 border:1px solid #393946;border-radius:17px;
 padding:15px;outline:none
}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{border-color:#b84eff}

.btn{
 width:100%;border:0;border-radius:17px;padding:15px;
 margin-top:12px;color:white;font-weight:800;
 background:linear-gradient(135deg,#f33d9e,#7652ff)
}
.secondary{background:#24242e}
.logout{
 border:1px solid #393946;background:#181820;
 color:#ccc;padding:11px 14px;border-radius:14px
}

.status{
 display:none;margin-top:12px;padding:12px;border-radius:13px;
 background:#1d1d27;color:#aaa
}
.status.show{display:block}
.status.ok{color:#71e6a0}
.status.error{color:#ff7777}

.small{font-size:14px;color:#858592;line-height:1.5}

.entry{
 margin-top:14px;padding:17px;border-radius:20px;
 background:#171720;border:1px solid #30303d
}
.entryHead{display:flex;gap:11px;align-items:center}
.avatar{
 width:47px;height:47px;border-radius:15px;
 background:linear-gradient(135deg,#f33d9e,#7652ff);
 display:flex;align-items:center;justify-content:center
}
.entryName{font-weight:800}
.time{font-size:12px;color:#777;margin-top:3px}
.entryText{white-space:pre-wrap;margin-top:13px;line-height:1.55}
.entryImage{
 width:100%;max-height:600px;object-fit:contain;
 margin-top:13px;border-radius:17px;background:#08080c
}

.reactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.react{
 background:#111119;border:1px solid #393946;color:#fff;
 border-radius:14px;padding:8px 12px
}

.messages{
 height:390px;overflow-y:auto;padding:10px;
 background:#0d0d14;border:1px solid #33333f;border-radius:20px
}
.message{
 max-width:80%;padding:11px 14px;border-radius:17px;
 margin:8px 0;line-height:1.45
}
.mine{
 margin-left:auto;
 background:linear-gradient(135deg,#ee3b9e,#7750ff)
}
.other{background:#25252f}
.msgName{font-size:12px;opacity:.7;margin-bottom:4px}
.msgTime{font-size:10px;opacity:.5;margin-top:5px}

.send{
 display:flex;gap:8px;margin-top:10px
}
.send input{flex:1}
.send button{
 width:90px;border:0;border-radius:16px;color:#fff;
 background:linear-gradient(135deg,#f33d9e,#7652ff);
 font-weight:800
}

.empty{text-align:center;color:#70707d;padding:55px 10px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
<div class="box">

<div class="logo">❤️</div>
<div class="title">Our Diary</div>

<label>Tài khoản</label>
<input id="username" autocomplete="username">

<label>Mật khẩu</label>
<input id="password" type="password" autocomplete="current-password">

<button class="btn" onclick="login()">Đăng nhập</button>

<div id="loginStatus" class="status"></div>

</div>
</div>


<!-- APP -->
<div id="app" class="hidden">

<header>
<div class="brand">
<div class="brandIcon">❤️</div>
<div>
<div class="brandName">Our Diary</div>
<div id="displayName" class="brandUser"></div>
</div>
</div>

<button class="logout" onclick="logout()">Đăng xuất</button>
</header>


<div class="container">

<!-- NHẬT KÝ -->
<div class="card">

<h2>❤️ Đăng nhật ký</h2>

<textarea id="content"
placeholder="Hôm nay bạn muốn viết gì?"></textarea>

<label>📷 Ảnh đính kèm</label>
<input id="image" type="file" accept="image/*">

<button class="btn" onclick="postDiary()">
Đăng nhật ký
</button>

<div id="postStatus" class="status"></div>

</div>


<!-- BIỆT DANH -->
<div class="card">

<h2>🥰 Biệt danh</h2>

<div class="small">
Bạn đặt biệt danh cho người kia.
Hai người có thể đặt biệt danh riêng cho nhau.
</div>

<label>
Biệt danh cho <span id="targetName">người kia</span>
</label>

<input id="nickname" placeholder="Ví dụ: Bé yêu">

<button class="btn" onclick="saveNickname()">
Lưu biệt danh
</button>

<div id="nickStatus" class="status"></div>

</div>


<!-- TIN NHẮN -->
<div class="card">

<h2>💬 Tin nhắn</h2>

<div id="messages" class="messages">
<div class="empty">Chưa có tin nhắn</div>
</div>

<div class="send">
<input id="messageInput"
placeholder="Nhập tin nhắn..."
onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Gửi</button>
</div>

<div id="messageStatus" class="status"></div>

</div>


<!-- TELEGRAM -->
<div class="card">

<h2>🤖 Telegram</h2>

<div class="small">
Nhập Bot Token và Chat ID tại đây.
Dữ liệu được lưu vào Supabase.
</div>

<label>Bot Token</label>
<input id="botToken" type="password"
placeholder="123456789:AA...">

<label>Chat ID</label>
<input id="chatId"
placeholder="-100xxxxxxxxxx">

<button class="btn" onclick="saveTelegram()">
Lưu Telegram
</button>

<button class="btn secondary" onclick="testTelegram()">
Test Telegram
</button>

<div id="telegramStatus" class="status"></div>

</div>


<!-- ĐỔI TK MK -->
<div class="card">

<h2>⚙️ Đổi tài khoản</h2>

<label>Tài khoản mới</label>
<input id="newUsername"
placeholder="Bỏ trống nếu không đổi">

<label>Mật khẩu hiện tại</label>
<input id="oldPassword" type="password">

<label>Mật khẩu mới</label>
<input id="newPassword" type="password">

<label>Nhập lại mật khẩu mới</label>
<input id="confirmPassword" type="password">

<button class="btn" onclick="changeAccount()">
Lưu thay đổi
</button>

<div id="accountStatus" class="status"></div>

</div>


<!-- NHẬT KÝ -->
<div class="card">

<h2>📖 Nhật ký</h2>

<div id="diaryList">
<div class="empty">Chưa có nhật ký</div>
</div>

</div>

</div>
</div>


<script>

/* ==========================================
SUPABASE
========================================== */

const SUPABASE_URL =
"https://mmgqalltjkwpnxmfrajh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Ce_O6R53zyBorjk9eF0tUg_XwstpHWk";

const supabase =
window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* ==========================================
STATE
========================================== */

let me=null;
let other=null;
let channels=[];


/* ==========================================
HELPER
========================================== */

function $(id){
 return document.getElementById(id);
}

function esc(x){
 return String(x ?? "")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function status(id,text,type=""){
 const e=$(id);
 e.textContent=text;
 e.className="status show "+type;

 setTimeout(()=>{
   e.className="status";
 },5000);
}

function dateText(x){
 return new Date(x).toLocaleString("vi-VN");
}


/* ==========================================
LOGIN
========================================== */

async function login(){

 const username=$("username").value.trim();
 const password=$("password").value;

 if(!username || !password){
   status(
     "loginStatus",
     "Nhập tài khoản và mật khẩu.",
     "error"
   );
   return;
 }

 try{

   /*
      DÙNG RPC SQL:
      login_diary_user(text,text)
   */

   const {data,error} =
     await supabase.rpc(
       "login_diary_user",
       {
         p_username:username,
         p_password:password
       }
     );

   if(error) throw error;

   if(!data || !data.length){

     status(
       "loginStatus",
       "Sai tài khoản hoặc mật khẩu.",
       "error"
     );

     return;
   }

   me=data[0];

   localStorage.setItem(
     "diary_user_id",
     me.id
   );

   await start();

 }catch(e){

   console.error(e);

   status(
     "loginStatus",
     "Lỗi đăng nhập: "+e.message,
     "error"
   );
 }
}


/* ==========================================
START
========================================== */

async function start(){

 $("loginPage").classList.add("hidden");
 $("app").classList.remove("hidden");

 $("displayName").textContent=
   me.display_name;

 await findOther();
 await loadNickname();
 await loadTelegram();
 await loadDiary();
 await loadMessages();

 realtime();
}


/* ==========================================
FIND OTHER USER
========================================== */

async function findOther(){

 const {data,error} =
   await supabase
   .from("diary_users")
   .select("id,username,display_name")
   .neq("id",me.id)
   .limit(1)
   .maybeSingle();

 if(error){

   console.error(error);

   return;
 }

 other=data;

 if(other){

   $("targetName").textContent=
     other.display_name;
 }
}


/* ==========================================
NICKNAME
========================================== */

async function loadNickname(){

 if(!other) return;

 const {data,error} =
   await supabase
   .from("diary_nicknames")
   .select("*")
   .eq("owner_id",me.id)
   .eq("target_id",other.id)
   .maybeSingle();

 if(error){

   console.error(error);
   return;
 }

 $("nickname").value=
   data?.nickname || "";
}


async function saveNickname(){

 if(!other){

   status(
     "nickStatus",
     "Không tìm thấy người kia.",
     "error"
   );

   return;
 }

 const nickname=
   $("nickname").value.trim();

 if(!nickname){

   status(
     "nickStatus",
     "Nhập biệt danh.",
     "error"
   );

   return;
 }

 try{

   const {error} =
     await supabase
     .from("diary_nicknames")
     .upsert({

       owner_id:me.id,

       target_id:other.id,

       nickname:nickname,

       updated_at:new Date().toISOString()

     },{
       onConflict:"owner_id,target_id"
     });

   if(error) throw error;

   status(
     "nickStatus",
     "Đã lưu biệt danh.",
     "ok"
   );

   await loadDiary();
   await loadMessages();

 }catch(e){

   console.error(e);

   status(
     "nickStatus",
     "Lỗi: "+e.message,
     "error"
   );
 }
}


/* ==========================================
GET NAME
========================================== */

async function nameFor(userId){

 if(userId===me.id)
   return me.display_name;

 const {data} =
   await supabase
   .from("diary_nicknames")
   .select("nickname")
   .eq("owner_id",me.id)
   .eq("target_id",userId)
   .maybeSingle();

 if(data?.nickname)
   return data.nickname;

 const {data:user} =
   await supabase
   .from("diary_users")
   .select("display_name")
   .eq("id",userId)
   .maybeSingle();

 return user?.display_name || "Người dùng";
}


/* ==========================================
POST DIARY
========================================== */

async function postDiary(){

 const content=
   $("content").value.trim();

 const file=
   $("image").files?.[0];

 if(!content && !file){

   status(
     "postStatus",
     "Nhập nội dung hoặc chọn ảnh.",
     "error"
   );

   return;
 }

 try{

   let image_url=null;

   if(file){

     const ext=
       file.name.split(".").pop();

     const path=
       me.id+"/"+Date.now()+"."+ext;

     const {error} =
       await supabase
       .storage
       .from("diary-images")
       .upload(
         path,
         file,
         {
           upsert:true,
           contentType:file.type
         }
       );

     if(error) throw error;

     const {data} =
       supabase
       .storage
       .from("diary-images")
       .getPublicUrl(path);

     image_url=data.publicUrl;
   }

   const {error} =
     await supabase
     .from("diary_entries")
     .insert({

       user_id:me.id,

       content:content,

       image_url:image_url

     });

   if(error) throw error;

   $("content").value="";
   $("image").value="";

   status(
     "postStatus",
     "Đã đăng nhật ký.",
     "ok"
   );

   await loadDiary();

   const name=
     await nameFor(me.id);

   await telegramSend(
     name+" đã up ghi chú"
   );

 }catch(e){

   console.error(e);

   status(
     "postStatus",
     "Lỗi đăng: "+e.message,
     "error"
   );
 }
}


/* ==========================================
DIARY
========================================== */

async function loadDiary(){

 const {data,error} =
   await supabase
   .from("diary_entries")
   .select("*")
   .order(
     "created_at",
     {ascending:false}
   );

 if(error){

   console.error(error);

   $("diaryList").innerHTML=
   `<div class="empty">
      Lỗi tải nhật ký
    </div>`;

   return;
 }

 if(!data?.length){

   $("diaryList").innerHTML=
   `<div class="empty">
      Chưa có nhật ký
    </div>`;

   return;
 }

 let html="";

 for(const row of data){

   const name=
     await nameFor(row.user_id);

   const reactions=
     await reactionCounts(row.id);

   html+=`

   <div class="entry">

     <div class="entryHead">

       <div class="avatar">❤️</div>

       <div>
         <div class="entryName">
           ${esc(name)}
         </div>

         <div class="time">
           ${dateText(row.created_at)}
         </div>
       </div>

     </div>

     ${
       row.content
       ?
       `<div class="entryText">
         ${esc(row.content)}
       </div>`
       :""
     }

     ${
       row.image_url
       ?
       `<img class="entryImage"
         src="${esc(row.image_url)}">`
       :""
     }

     <div class="reactions">

       ${reaction(row.id,"❤️",reactions["❤️"]||0)}
       ${reaction(row.id,"😂",reactions["😂"]||0)}
       ${reaction(row.id,"😍",reactions["😍"]||0)}
       ${reaction(row.id,"😢",reactions["😢"]||0)}
       ${reaction(row.id,"😡",reactions["😡"]||0)}
       ${reaction(row.id,"👍",reactions["👍"]||0)}

     </div>

   </div>

   `;
 }

 $("diaryList").innerHTML=html;
}


function reaction(id,emoji,count){

 return `
 <button
 class="react"
 onclick="toggleReaction('${id}','${emoji}')">
 ${emoji} ${count}
 </button>
 `;
}


/* ==========================================
REACTIONS
========================================== */

async function reactionCounts(entryId){

 const {data,error} =
   await supabase
   .from("diary_reactions")
   .select("reaction")
   .eq("entry_id",entryId);

 if(error){

   console.error(error);
   return {};
 }

 const out={};

 for(const row of data||[]){

   out[row.reaction]=
     (out[row.reaction]||0)+1;
 }

 return out;
}


async function toggleReaction(entryId,emoji){

 try{

   const {data,error} =
     await supabase
     .from("diary_reactions")
     .select("id,reaction")
     .eq("entry_id",entryId)
     .eq("user_id",me.id)
     .maybeSingle();

   if(error) throw error;

   if(data){

     if(data.reaction===emoji){

       const {error:e} =
         await supabase
         .from("diary_reactions")
         .delete()
         .eq("id",data.id);

       if(e) throw e;

     }else{

       const {error:e} =
         await supabase
         .from("diary_reactions")
         .update({
           reaction:emoji
         })
         .eq("id",data.id);

       if(e) throw e;
     }

   }else{

     const {error:e} =
       await supabase
       .from("diary_reactions")
       .insert({

         entry_id:entryId,

         user_id:me.id,

         reaction:emoji

       });

     if(e) throw e;
   }

   await loadDiary();

 }catch(e){

   alert(
     "Không thể thả cảm xúc: "+e.message
   );
 }
}


/* ==========================================
MESSAGES
========================================== */

async function loadMessages(){

 const {data,error} =
   await supabase
   .from("diary_messages")
   .select("*")
   .order(
     "created_at",
     {ascending:true}
   );

 if(error){

   console.error(error);

   $("messages").innerHTML=
   `<div class="empty">
      Lỗi tải tin nhắn
    </div>`;

   return;
 }

 if(!data?.length){

   $("messages").innerHTML=
   `<div class="empty">
      Chưa có tin nhắn
    </div>`;

   return;
 }

 let html="";

 for(const msg of data){

   const mine=
     msg.sender_id===me.id;

   const name=
     await nameFor(msg.sender_id);

   html+=`

   <div class="message ${mine?"mine":"other"}">

     <div class="msgName">
       ${esc(name)}
     </div>

     ${esc(msg.message)}

     <div class="msgTime">
       ${dateText(msg.created_at)}
     </div>

   </div>

   `;
 }

 $("messages").innerHTML=html;

 $("messages").scrollTop=
   $("messages").scrollHeight;
}


async function sendMessage(){

 const text=
   $("messageInput").value.trim();

 if(!text) return;

 if(!other){

   status(
     "messageStatus",
     "Không tìm thấy người nhận.",
     "error"
   );

   return;
 }

 try{

   const {error} =
     await supabase
     .from("diary_messages")
     .insert({

       sender_id:me.id,

       receiver_id:other.id,

       message:text

     });

   if(error) throw error;

   $("messageInput").value="";

   await loadMessages();

   const sender=
     await nameFor(me.id);

   const receiver=
     await nameFor(other.id);

   await telegramSend(
     sender+
     " đã gửi tin nhắn cho "+
     receiver
   );

 }catch(e){

   console.error(e);

   status(
     "messageStatus",
     "Lỗi gửi tin nhắn: "+e.message,
     "error"
   );
 }
}


/* ==========================================
TELEGRAM LOAD
========================================== */

async function loadTelegram(){

 const {data,error} =
   await supabase
   .from("diary_settings")
   .select("*")
   .eq("id",true)
   .maybeSingle();

 if(error){

   console.error(error);
   return;
 }

 if(data){

   $("botToken").value=
     data.bot_token || "";

   $("chatId").value=
     data.chat_id || "";
 }
}


/* ==========================================
TELEGRAM SAVE
========================================== */

async function saveTelegram(){

 const bot_token=
   $("botToken").value.trim();

 const chat_id=
   $("chatId").value.trim();

 if(!bot_token || !chat_id){

   status(
     "telegramStatus",
     "Nhập Bot Token và Chat ID.",
     "error"
   );

   return;
 }

 try{

   const {error} =
     await supabase
     .from("diary_settings")
     .upsert({

       id:true,

       bot_token:bot_token,

       chat_id:chat_id,

       updated_at:
         new Date().toISOString()

     });

   if(error) throw error;

   status(
     "telegramStatus",
     "Đã lưu Telegram.",
     "ok"
   );

 }catch(e){

   console.error(e);

   status(
     "telegramStatus",
     "Lỗi lưu Telegram: "+e.message,
     "error"
   );
 }
}


/* ==========================================
TELEGRAM SEND
========================================== */

async function telegramSend(text){

 try{

   const {data,error} =
     await supabase
     .from("diary_settings")
     .select("bot_token,chat_id")
     .eq("id",true)
     .maybeSingle();

   if(error) throw error;

   if(!data?.bot_token ||
      !data?.chat_id){

     console.log(
       "Chưa nhập Telegram."
     );

     return;
   }

   const response=
     await fetch(
       "https://api.telegram.org/bot"+
       data.bot_token+
       "/sendMessage",
       {
         method:"POST",
         headers:{
           "Content-Type":
             "application/json"
         },
         body:JSON.stringify({
           chat_id:data.chat_id,
           text:text
         })
       }
     );

   const result=
     await response.json();

   if(!result.ok){

     console.error(
       "Telegram:",
       result
     );
   }

 }catch(e){

   console.error(
     "Telegram error:",
     e
   );
 }
}


/* ==========================================
TEST TELEGRAM
========================================== */

async function testTelegram(){

 const token=
   $("botToken").value.trim();

 const chat=
   $("chatId").value.trim();

 if(!token || !chat){

   status(
     "telegramStatus",
     "Nhập Token và Chat ID.",
     "error"
   );

   return;
 }

 try{

   const response=
     await fetch(
       "https://api.telegram.org/bot"+
       token+
       "/sendMessage",
       {
         method:"POST",
         headers:{
           "Content-Type":
             "application/json"
         },
         body:JSON.stringify({

           chat_id:chat,

           text:
             "✅ Our Diary: Telegram kết nối thành công."

         })
       }
     );

   const result=
     await response.json();

   if(!result.ok){

     throw new Error(
       result.description ||
       "Telegram không gửi được."
     );
   }

   await saveTelegram();

   status(
     "telegramStatus",
     "Test Telegram thành công.",
     "ok"
   );

 }catch(e){

   status(
     "telegramStatus",
     e.message,
     "error"
   );
 }


/* ==========================================
CHANGE ACCOUNT
========================================== */

async function changeAccount(){

 const newUsername=
   $("newUsername").value.trim();

 const oldPassword=
   $("oldPassword").value;

 const newPassword=
   $("newPassword").value;

 const confirm=
   $("confirmPassword").value;

 if(!oldPassword){

   status(
     "accountStatus",
     "Nhập mật khẩu hiện tại.",
     "error"
   );

   return;
 }

 if(newPassword &&
    newPassword!==confirm){

   status(
     "accountStatus",
     "Mật khẩu mới không khớp.",
     "error"
   );

   return;
 }

 try{

   /*
      Verify bằng RPC trước
   */

   const {data,error} =
     await supabase.rpc(
       "login_diary_user",
       {
         p_username:me.username,
         p_password:oldPassword
       }
     );

   if(error) throw error;

   if(!data?.length){

     status(
       "accountStatus",
       "Mật khẩu hiện tại không đúng.",
       "error"
     );

     return;
   }

   const update={};

   if(newUsername)
     update.username=newUsername;

   if(newPassword){

     /*
       SQL của m đang lưu bcrypt crypt().
       Vì vậy việc đổi password trực tiếp
       bằng JS SHA-256 sẽ không đúng.

       Dùng RPC SQL riêng nếu muốn đổi password.
     */

     status(
       "accountStatus",
       "Phần đổi mật khẩu cần thêm RPC riêng để dùng crypt().",
       "error"
     );

     return;
   }

   if(!Object.keys(update).length){

     status(
       "accountStatus",
       "Chưa có gì để thay đổi.",
       "error"
     );

     return;
   }

   const {data:newData,error:updateError} =
     await supabase
     .from("diary_users")
     .update(update)
     .eq("id",me.id)
     .select("id,username,display_name")
     .single();

   if(updateError) throw updateError;

   me=newData;

   $("displayName").textContent=
     me.display_name;

   $("newUsername").value="";
   $("oldPassword").value="";

   status(
     "accountStatus",
     "Đã đổi tài khoản.",
     "ok"
   );

 }catch(e){

   console.error(e);

   status(
     "accountStatus",
     "Lỗi: "+e.message,
     "error"
   );
 }
}


/* ==========================================
REALTIME
========================================== */

function realtime(){

 channels.forEach(
   x=>supabase.removeChannel(x)
 );

 channels=[];

 const diary=
   supabase
   .channel("diary-realtime")
   .on(
     "postgres_changes",
     {
       event:"*",
       schema:"public",
       table:"diary_entries"
     },
     ()=>loadDiary()
   )
   .subscribe();

 channels.push(diary);


 const msg=
   supabase
   .channel("message-realtime")
   .on(
     "postgres_changes",
     {
       event:"*",
       schema:"public",
       table:"diary_messages"
     },
     ()=>loadMessages()
   )
   .subscribe();

 channels.push(msg);


 const nick=
   supabase
   .channel("nickname-realtime")
   .on(
     "postgres_changes",
     {
       event:"*",
       schema:"public",
       table:"diary_nicknames"
     },
     async ()=>{
       await loadNickname();
       await loadDiary();
       await loadMessages();
     }
   )
   .subscribe();

 channels.push(nick);


 const react=
   supabase
   .channel("reaction-realtime")
   .on(
     "postgres_changes",
     {
       event:"*",
       schema:"public",
       table:"diary_reactions"
     },
     ()=>loadDiary()
   )
   .subscribe();

 channels.push(react);
}


/* ==========================================
LOGOUT
========================================== */

function logout(){

 channels.forEach(
   x=>supabase.removeChannel(x)
 );

 channels=[];

 me=null;
 other=null;

 localStorage.removeItem(
   "diary_user_id"
 );

 $("app").classList.add("hidden");
 $("loginPage").classList.remove("hidden");

 $("password").value="";
}


/* ==========================================
AUTO LOGIN
========================================== */

async function autoLogin(){

 const id=
   localStorage.getItem(
     "diary_user_id"
   );

 if(!id) return;

 const {data,error} =
   await supabase
   .from("diary_users")
   .select("id,username,display_name")
   .eq("id",id)
   .maybeSingle();

 if(error || !data){

   localStorage.removeItem(
     "diary_user_id"
   );

   return;
 }

 me=data;

 await start();
}

autoLogin();

</script>
