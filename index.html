<body>

<header>
    <div class="header">
        <div class="logo">🍔 FOOD ORDER</div>

        <button class="cart-button" onclick="openCart()">
            🛒 Giỏ hàng

        </button>
    </div>
</header>

<div class="container">

    <div class="banner">
        <h1>Đặt món ngay 🍽️</h1>
        <p>Ngon - nhanh - tiện lợi</p>
    </div>

    <div class="categories">

        <button class="cat active"
                onclick="changeCategory('all',this)">
            🍽️ Tất cả
        </button>

        <button class="cat"
                onclick="changeCategory('main',this)">
            🍚 Ăn chính
        </button>

        <button class="cat"
                onclick="changeCategory('snack',this)">
            🍟 Ăn vặt
        </button>

        <button class="cat"
                onclick="changeCategory('extra',this)">
            🧀 Đồ ăn thêm
        </button>

        <button class="cat"
                onclick="changeCategory('drink',this)">
            🥤 Đồ uống
        </button>

    </div>

    <div class="section-title" id="sectionTitle">
        Tất cả món
    </div>

    <div id="foodList"></div>

</div>

<div class="bottom-cart">
    <div class="bottom-cart-inner">

            🛒 Xem giỏ hàng •

</div>


<!-- CART MODAL -->

<div class="modal" id="cartModal">

    <div class="modal-box">

        <div class="modal-head">

            <div class="modal-title">
                🛒 Giỏ hàng
            </div>

            <button class="close"
                    onclick="closeModal('cartModal')">
                ×
            </button>

        </div>

        <div id="cartItems"></div>

        <div class="total">
            <span>Tổng cộng</span>
            <span id="cartTotal">0đ</span>
        </div>

        <button class="checkout-btn"
                onclick="openCheckout()">
            Tiếp tục đặt hàng
        </button>

    </div>

</div>


<!-- CHECKOUT MODAL -->

<div class="modal" id="checkoutModal">

    <div class="modal-box">

        <div class="modal-head">

            <div class="modal-title">
                📦 Thông tin giao hàng
            </div>

            <button class="close"
                    onclick="closeModal('checkoutModal')">
                ×
            </button>

        </div>

        <label>Họ tên</label>

        <input
            id="customerName"
            placeholder="Nguyễn Văn A"
        >

        <label>Số điện thoại</label>

        <input
            id="customerPhone"
            type="tel"
            placeholder="09xxxxxxxx"
        >

        <label>Địa chỉ</label>

        <textarea
            id="customerAddress"
            rows="3"
            placeholder="Nhập địa chỉ giao hàng..."
        ></textarea>

        <label>Phương thức thanh toán</label>

        <select id="payment">

            <option value="COD">
                💵 Tiền mặt khi nhận hàng
            </option>

            <option value="BANK">
                🏦 Chuyển khoản
            </option>

        </select>

        <button
            class="checkout-btn"
            onclick="placeOrder()"
            style="margin-top:15px">

            ✅ XÁC NHẬN ĐẶT HÀNG

        </button>

    </div>

</div>


<!-- SUCCESS -->

<div class="modal" id="successModal">

    <div class="modal-box">

        <div class="success">

            <div class="success-icon">
                🎉
            </div>

            <h2>Đặt hàng thành công!</h2>

            <p>Mã đơn hàng:</p>

            <div class="order-code"
                 id="orderCode">
            </div>

            <p>
                Đơn hàng đã được lưu trên thiết bị.
            </p>

            <button
                class="checkout-btn"
                onclick="location.reload()">

                Về trang chủ

            </button>

        </div>

    </div>

</div>


<script>

const foods = [

    /* ĂN CHÍNH */

    {
        id:1,
        name:"Cơm Gà Chiên",
        price:45000,
        category:"main",
        desc:"Cơm trắng + gà chiên giòn + rau",

    },

    {
        id:3,
        name:"Bún Bò",
        price:55000,
        category:"main",

        img:"https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=900"
    },

    {
        id:4,

        price:55000,
        category:"main",
        desc:"Phở bò truyền thống",
        img:"https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=900"
    },

    /* ĂN VẶT */

    {
        id:5,
        name:"Khoai Tây Chiên",
        price:25000,
        category:"snack",
        desc:"Khoai tây chiên giòn",
        img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=900"
    },

    {
        id:6,
        name:"Xúc Xích",
        price:20000,

        desc:"Xúc xích chiên thơm ngon",
        img:"https://images.unsplash.com/photo-1612392062631-94dd858cba88?w=900"
    },

    {

        price:25000,
        category:"snack",

        img:"https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=900"
    },

    {
        id:8,
        name:"Gà Viên",
        price:30000,
        category:"snack",
        desc:"Gà viên chiên giòn",
        img:"https://images.unsplash.com/photo-1562967914-608f82629710?w=900"
    },

    /* ĐỒ ĂN THÊM */

    {
        id:9,
        name:"Trứng Ốp La",
        price:10000,
        category:"extra",
        desc:"Thêm 1 trứng ốp la",
        img:"https://images.unsplash.com/photo-1525351484163-7529414344d8?w=900"
    },

    {
        id:10,
        name:"Thêm Phô Mai",
        price:15000,
        category:"extra",
        desc:"Phô mai lát",
        img:"https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=900"
    },

    {
        id:11,
        name:"Thêm Thịt Bò",
        price:25000,
        category:"extra",
        desc:"Thêm phần thịt bò",
        img:"https://images.unsplash.com/photo-1544025162-d76694265947?w=900"
    },

    {
        id:12,
        name:"Thêm Trứng Luộc",
        price:10000,
        category:"extra",
        desc:"Trứng luộc",

    },

    /* ĐỒ UỐNG */

    {
        id:13,
        name:"Coca Cola",
        price:15000,
        category:"drink",
        desc:"Coca Cola mát lạnh",
        img:"https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=900"
    },

    {
        id:14,
        name:"Trà Đào",
        price:25000,
        category:"drink",
        desc:"Trà đào thơm mát",
        img:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=900"
    },

    {
        id:15,
        name:"Trà Chanh",
        price20000,
        category:"drink",
        desc:"Trà chanh giải khát",
        img:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=900"
    },

    {
        id:16,
        name:"Nước Suối",
        price:10000,
        category:"drink",
        desc:"Nước suối đóng chai",
        img:"https://images.unsplash.com/photo-1564419320461-6870880221ad?w=900"
    }

];


/* SỬA LỖI GIÁ TRÀ CHANH */

foods[14].price = 20000;


/* CART */

let cart = [];


/* MONEY */

function money(number){

    return number.toLocaleString("vi-VN")+"đ";

}


/* RENDER FOOD */

function renderFoods(category="all"){

    const box =
        document.getElementById("foodList");

    let list = foods;

    if(category !== "all"){

        list =
            foods.filter(
                item => item.category === category
            );

    }

    if(list.length === 0){

        box.innerHTML =
            `<div class="empty">
                Không có món nào.
             </div>`;

        return;

    }

    box.innerHTML = list.map(food => `

        <div class="food">

            <img
                class="food-img"
                src="${food.img}"
                alt="${food.name}"
                onerror="this.style.display='none'"
            >

            <div class="food-content">

                <div class="food-name">
                    ${food.name}
                </div>

                <div class="food-desc">
                    ${food.desc}
                </div>

                <div class="food-bottom">

                    <div class="price">
                        ${money(food.price)}
                    </div>

                    <button
                        class="add-btn"
                        onclick="addToCart(${food.id})">

                        + Thêm

                    </button>

                </div>

            </div>

        </div>

    `).join("");

}


/* CATEGORY */

function changeCategory(category, button){

    document
        .querySelectorAll(".cat")
        .forEach(
            b => b.classList.remove("active")
        );

    button.classList.add("active");

    const titles = {

        all:"Tất cả món",
        main:"🍚 Ăn chính",
        snack:"🍟 Ăn vặt",
        extra:"🧀 Đồ ăn thêm",
        drink:"🥤 Đồ uống"

    };

    document.getElementById("sectionTitle")
        .textContent = titles[category];

    renderFoods(category);

}


/* ADD CART */

function addToCart(id){

    const food =
        foods.find(item => item.id === id);

    if(!food) return;

    const item =
        cart.find(item => item.id === id);

    if(item){

        item.qty++;

    }else{

        cart.push({
            ...food,
            qty:1
        });

    }

    updateCart();

}


/* UPDATE CART */

function updateCart(){

    const count =
        cart.reduce(
            (total,item)=>total+item.qty,
            0
        );

    const total =
        cart.reduce(
            (sum,item)=>
                sum + item.price * item.qty,
            0
        );

    document.getElementById("cartCount")
        .textContent = count;

    document.getElementById("bottomTotal")
        .textContent = money(total);

}


/* OPEN CART */

function openCart(){

    renderCart();

    document
        .getElementById("cartModal")
        .classList.add("show");

}


/* RENDER CART */

function renderCart(){

    const box =
        document.getElementById("cartItems");

    if(cart.length === 0){

        box.innerHTML =
            `<div class="empty">
                🛒 Giỏ hàng đang trống
             </div>`;

        document.getElementById("cartTotal")
            .textContent = "0đ";

        return;

    }

    box.innerHTML =
        cart.map(item => `

            <div class="cart-item">

                <div class="cart-info">

                    <div class="cart-name">
                        ${item.name}
                    </div>

                    <div class="cart-price">
                        ${money(item.price)}
                    </div>

                </div>

                <div class="quantity">

                    <button
                        onclick="changeQty(${item.id},-1)">
                        −
                    </button>

                    <b>
                        ${item.qty}
                    </b>

                    <button
                        onclick="changeQty(${item.id},1)">
                        +
                    </button>

                </div>

            </div>

        `).join("");

    const total =
        cart.reduce(
            (sum,item)=>
                sum + item.price * item.qty,
            0
        );

    document.getElementById("cartTotal")
        .textContent = money(total);

}


/* CHANGE QUANTITY */

function changeQty(id, amount){

    const item =
        cart.find(item => item.id === id);

    if(!item) return;

    item.qty += amount;

    if(item.qty <= 0){

        cart =
            cart.filter(item => item.id !== id);

    }

    updateCart();

    renderCart();

}


/* OPEN CHECKOUT */

function openCheckout(){

    if(cart.length === 0){

        alert("Giỏ hàng đang trống!");

        return;

    }

    closeModal("cartModal");

    document
        .getElementById("checkoutModal")
        .classList.add("show");

}


/* PLACE ORDER */

function placeOrder(){

    const name =
        document
            .getElementById("customerName")
            .value.trim();

    const phone =
        document
            .getElementById("customerPhone")
            .value.trim();

    const address =
        document
            .getElementById("customerAddress")
            .value.trim();

    const payment =
        document
            .getElementById("payment")
            .value;

    if(!name){

        alert("Vui lòng nhập họ tên!");

        return;

    }

    if(!phone){

        alert("Vui lòng nhập số điện thoại!");

        return;

    }

    if(!address){

        alert("Vui lòng nhập địa chỉ!");

        return;

    }

    if(!cart.length){

        alert("Giỏ hàng đang trống!");

        return;

    }


    const total =
        cart.reduce(
            (sum,item)=>
                sum + item.price * item.qty,
            0
        );


    const order = {

        id:
            "OD" +
            Date.now()
                .toString()
                .slice(-7),

        customer:{

            name:name,
            phone:phone,
            address:address

        },

        payment:payment,

        items:JSON.parse(
            JSON.stringify(cart)
        ),

        total:total,

        status:"Chờ xác nhận",

        createdAt:
            new Date()
                .toLocaleString("vi-VN")

    };


    const orders =
        JSON.parse(
            localStorage.getItem("orders") ||
            "[]"
        );


    orders.push(order);


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    document.getElementById("orderCode")
        .textContent = order.id;


    closeModal("checkoutModal");


    document
        .getElementById("successModal")
        .classList.add("show");


    cart = [];

    updateCart();

}


/* CLOSE */

function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}


/* CLICK OUTSIDE */

document.querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener("click",function(e){

            if(e.target === modal){

                modal.classList.remove("show");

            }

        });

    });


/* START */

renderFoods();

updateCart();

</script>

</body>
</html>
