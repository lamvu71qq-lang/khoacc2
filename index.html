<<!DOCTYPE html>
<html lang="vi">
<head>

<style>
*{

html,body{

}

button,
input,
textarea,

}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

::-webkit-scrollbar{
    width:6px;

::-webkit-scrollbar-thumb{

}


/* =========================
   LOGIN
========================= */

#loginPage{

    display:flex;
    justify-content:center;

.login-box{

.login-sub{

.input-group{

}

.input-group label{

}

.input-group input,
.input-group textarea,

.login-btn{

}


/* =========================
   APP
========================= */

#app{

}

.app-container{
    max-width:780px;

.topbar{

.topbar-inner{

.brand{

.brand-icon{

.logout-btn{

/* =========================
   CONTENT
========================= */

.content{

}

.section{
    margin-bottom:16px;
}

.card{

.card-title{

/* =========================
   PEOPLE
========================= */

.people{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.person{
    padding:16px;

.person-icon{

/* =========================

========================= */

textarea{

.photo-input{

.preview{

.preview img{

    height:34px;

.write-btn{
    width:100%;

    padding:14px;
    border-radius:15px;

    font-weight:900;
}

.write-btn:disabled{
    opacity:.5;

}


/* =========================
   DIARY
========================= */

.entry{
    background:#14141c;
    border:1px solid #292934;

.entry-header{

}

.author{

}

.avatar{

.author-name{

}

.entry-time{

.mood{

}

.entry-text{

.entry-image{

}

.entry-footer{

.delete-btn{

.empty{

/* =========================
   SETTINGS
========================= */

.nickname-info{
    color:#777783;
    font-size:12px;
    line-height:1.5;

}

.save-btn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:14px;
    background:#22222c;
    color:#fff;
    font-weight:800;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,120px);
    z-index:100;
    padding:13px 18px;
    border-radius:14px;
    background:#22222b;
    border:1px solid #3a3a47;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    transition:.3s;
    font-size:13px;
}

.toast.show{
    transform:translate(-50%,0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    }

    .brand-title{
        font-size:15px;
    }

    .logout-btn{

    }
}
</style>
</head>

<body>

<div

<script>

/* ==========================================================
   CẤU HÌNH
========================================================== */


/* SUPABASE */

const SUPABASE_URL =
    "https://mmgqalltjkwpnxmfrajh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Ce_O6R53zyBorjk9eF0tUg_XwstpHWk";


/*
==============================================================
TELEGRAM

Dán BOT TOKEN của bạn vào đây.
==============================================================
*/

const TELEGRAM_BOT_TOKEN =
    "DAN_BOT_TOKEN_MOI_VAO_DAY";


const TELEGRAM_CHAT_ID =
    "-5515276053";


const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================================
   STATE
========================================================== */

let currentUser = null;

let users = [];

let nicknameMap = {};

let realtimeChannel = null;


/* ==========================================================
   LOGIN
========================================================== */

async function login(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("loginError");

    const button =
        document
        .getElementById("loginButton");


    error.textContent = "";


    if(!username || !password){

        error.textContent =
            "Vui lòng nhập tài khoản và mật khẩu.";

        return;
    }


    button.disabled = true;
    button.textContent = "Đang đăng nhập...";


    try{

        const {data,error:rpcError} =
            await db.rpc(
                "login_diary",
                {
                    p_username:username,
                    p_password:password
                }
            );


        if(rpcError){

            console.error(rpcError);

            throw new Error(
                rpcError.message
            );
        }


        if(!data || data.length === 0){

            throw new Error(
                "Sai tài khoản hoặc mật khẩu."
            );
        }


        currentUser = data[0];


        sessionStorage.setItem(
            "diaryUser",
            JSON.stringify(currentUser)
        );


        await startApp();


    }
    catch(errorObject){

        error.textContent =
            errorObject.message ||
            "Đăng nhập thất bại.";

    }
    finally{

        button.disabled = false;
        button.textContent =
            "Đăng nhập ❤️";

    }

}


/* ==========================================================
   START APP
========================================================== */

async function startApp(){

    document
    .getElementById("loginPage")
    .classList.add("hidden");


    document
    .getElementById("app")
    .classList.remove("hidden");


    document
    .getElementById("currentUserName")
    .textContent =
        currentUser.display_name;


    await loadUsers();

    await loadNicknames();

    await loadDiary();

    subscribeRealtime();

}


/* ==========================================================
   LOAD USERS
========================================================== */

async function loadUsers(){

    /*
       Vì bảng diary_users đang RLS,
       dùng RPC để lấy 2 người.
    */

    const {data,error} =
        await db.rpc(
            "get_diary_users"
        );


    if(error){

        console.error(error);

        /*
           fallback
        */

        users = [
            {
                id:currentUser.id,
                username:currentUser.username,
                display_name:currentUser.display_name
            }
        ];

        return;
    }


    users =
        data || [];


    renderPeople();

}


/* ==========================================================
   PEOPLE
========================================================== */

function getOtherUser(){

    return users.find(
        user =>
            user.id !== currentUser.id
    );
}


function renderPeople(){

    if(!currentUser)
        return;


    const other =
        getOtherUser();


    document
    .getElementById("person1Name")
    .textContent =
        currentUser.display_name;


    document
    .getElementById("person1Nick")
    .textContent =
        nicknameMap[currentUser.id]
        ? "💕 " + nicknameMap[currentUser.id]
        : "";


    if(other){

        document
        .getElementById("person2Name")
        .textContent =
            other.display_name;


        document
        .getElementById("person2Nick")
        .textContent =
            nicknameMap[other.id]
            ? "💕 " + nicknameMap[other.id]
            : "";

    }

}


/* ==========================================================
   NICKNAME
========================================================== */

async function loadNicknames(){

    const {data,error} =
        await db
        .from("diary_nicknames")
        .select("*");


    if(error){

        console.error(error);

        return;
    }


    nicknameMap = {};


    for(const row of data || []){

        if(
            row.owner_id ===
            currentUser.id
        ){

            nicknameMap[row.target_id] =
                row.nickname;

        }

    }


    const other =
        getOtherUser();


    if(other){

        document
        .getElementById("nicknameInput")
        .value =
            nicknameMap[other.id] || "";

    }


    renderPeople();

}


async function saveNickname(){

    const other =
        getOtherUser();


    if(!other){

        showToast(
            "Không tìm thấy người kia."
        );

        return;
    }


    const nickname =
        document
        .getElementById("nicknameInput")
        .value
        .trim();


    if(!nickname){

        showToast(
            "Hãy nhập biệt danh."
        );

        return;
    }


    const {error} =
        await db
        .from("diary_nicknames")
        .upsert(
            {
                owner_id:
                    currentUser.id,

                target_id:
                    other.id,

                nickname:
                    nickname,

                updated_at:
                    new Date().toISOString()
            },
            {
                onConflict:
                    "owner_id,target_id"
            }
        );


    if(error){

        console.error(error);

        showToast(
            "Không lưu được biệt danh."
        );

        return;
    }


    nicknameMap[other.id] =
        nickname;


    renderPeople();


    showToast(
        "Đã lưu biệt danh ❤️"
    );

}


/* ==========================================================
   IMAGE PREVIEW
========================================================== */

function previewImage(event){

    const file =
        event.target.files[0];


    const preview =
        document
        .getElementById("imagePreview");


    const img =
        document
        .getElementById("previewImg");


    if(!file){

        preview.style.display =
            "none";

        return;
    }


    if(!file.type.startsWith("image/")){

        showToast(
            "File phải là ảnh."
        );

        event.target.value = "";

        return;
    }


    if(file.size > 10 * 1024 * 1024){

        showToast(
            "Ảnh tối đa 10MB."
        );

        event.target.value = "";

        return;
    }


    img.src =
        URL.createObjectURL(file);


    preview.style.display =
        "block";

}


function removeImage(){

    document
    .getElementById("imageInput")
    .value = "";


    document
    .getElementById("imagePreview")
    .style.display =
        "none";


    document
    .getElementById("previewImg")
    .src = "";

}


/* ==========================================================
   ADD DIARY
========================================================== */

async function addDiary(){

    const content =
        document
        .getElementById("diaryContent")
        .value
        .trim();


    const mood =
        document
        .getElementById("mood")
        .value;


    const imageInput =
        document
        .getElementById("imageInput");


    const file =
        imageInput.files[0];


    const button =
        document
        .getElementById("writeButton");


    if(!content && !file){

        showToast(
            "Hãy viết nội dung hoặc chọn ảnh."
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "Đang đăng...";


    try{

        let imageUrl = null;


        /* ============================
           UPLOAD IMAGE
        ============================ */

        if(file){

            const extension =
                file.name
                .split(".")
                .pop()
                .toLowerCase();


            const path =
                currentUser.id +
                "/" +
                Date.now() +
                "-" +
                crypto.randomUUID() +
                "." +
                extension;


            const {error:uploadError} =
                await db
                .storage
                .from("diary-images")
                .upload(
                    path,
                    file,
                    {
                        contentType:
                            file.type,

                        cacheControl:
                            "3600",

                        upsert:false
                    }
                );


            if(uploadError){

                throw uploadError;
            }


            const {data:urlData} =
                db
                .storage
                .from("diary-images")
                .getPublicUrl(path);


            imageUrl =
                urlData.publicUrl;

        }


        /* ============================
           INSERT DIARY
        ============================ */

        const {data,error} =
            await db
            .from("diary_entries")
            .insert(
                {
                    user_id:
                        currentUser.id,

                    content:
                        content ||
                        "📷 Đã gửi một ảnh",

                    mood:
                        mood,

                    image_url:
                        imageUrl
                }
            )
            .select()
            .single();


        if(error){

            throw error;
        }


        /* ============================
           TELEGRAM
        ============================ */

        await sendTelegramNotification(
            data
        );


        /* ============================
           RESET
        ============================ */

        document
        .getElementById("diaryContent")
        .value = "";


        removeImage();


        showToast(
            "Đã ghi nhật ký ❤️"
        );

    }
    catch(errorObject){

        console.error(
            errorObject
        );


        showToast(
            "Lỗi: " +
            (
                errorObject.message ||
                "Không thể lưu."
            )
        );

    }
    finally{

        button.disabled = false;

        button.textContent =
            "❤️ Ghi vào nhật ký";

    }

}


/* ==========================================================
   TELEGRAM
========================================================== */

async function sendTelegramNotification(entry){

    /*
       Nếu bạn chưa dán token mới,
       bỏ qua Telegram.
    */

    if(
        !TELEGRAM_BOT_TOKEN ||
        TELEGRAM_BOT_TOKEN ===
        "DAN_BOT_TOKEN_MOI_VAO_DAY"
    ){

        console.warn(
            "Chưa cấu hình Telegram Bot Token."
        );

        return;
    }


    const text =
`📝 NHẬT KÝ MỚI ❤️

👤 ${currentUser.display_name}

${entry.mood || "❤️"}

${entry.content || ""}

🕐 ${
    new Date(
        entry.created_at
    ).toLocaleString(
        "vi-VN",
        {
            timeZone:
                "Asia/Ho_Chi_Minh"
        }
    )
}`;


    try{

        if(entry.image_url){

            const response =
                await fetch(
                    "https://api.telegram.org/bot" +
                    TELEGRAM_BOT_TOKEN +
                    "/sendPhoto",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                {
                                    chat_id:
                                        TELEGRAM_CHAT_ID,

                                    photo:
                                        entry.image_url,

                                    caption:
                                        text
                                }
                            )
                    }
                );


            const result =
                await response.json();


            if(!result.ok){

                console.error(
                    "Telegram lỗi:",
                    result
                );

                showToast(
                    "Đã lưu nhưng Telegram lỗi."
                );
            }


        }else{

            const response =
                await fetch(
                    "https://api.telegram.org/bot" +
                    TELEGRAM_BOT_TOKEN +
                    "/sendMessage",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                {
                                    chat_id:
                                        TELEGRAM_CHAT_ID,

                                    text:
                                        text
                                }
                            )
                    }
                );


            const result =
                await response.json();


            if(!result.ok){

                console.error(
                    "Telegram lỗi:",
                    result
                );

                showToast(
                    "Đã lưu nhưng Telegram lỗi."
                );
            }

        }

    }
    catch(error){

        console.error(
            "Telegram:",
            error
        );

        showToast(
            "Đã lưu nhưng không gửi Telegram."
        );

    }

}


/* ==========================================================
   LOAD DIARY
========================================================== */

async function loadDiary(){

    const {data,error} =
        await db
        .from("diary_entries")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        document
        .getElementById("diaryList")
        .innerHTML =
            `<div class="empty">
                Không tải được nhật ký.
            </div>`;

        return;
    }


    renderDiary(
        data || []
    );

}


/* ==========================================================
   RENDER DIARY
========================================================== */

function renderDiary(entries){

    const box =
        document
        .getElementById("diaryList");


    if(!entries.length){

        box.innerHTML =
            `<div class="empty">
                Chưa có ghi chú nào ❤️
            </div>`;

        return;
    }


    box.innerHTML = "";


    entries.forEach(
        entry => {

            const user =
                users.find(
                    x =>
                        x.id ===
                        entry.user_id
                );


            const name =
                user?.display_name ||
                "Người dùng";


            const time =
                new Date(
                    entry.created_at
                ).toLocaleString(
                    "vi-VN",
                    {
                        day:"2-digit",
                        month:"2-digit",
                        year:"numeric",
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "entry";


            element.innerHTML = `

                <div class="entry-header">

                    <div class="author">

                        <div class="avatar">
                            ❤️
                        </div>

                        <div>

                            <div class="author-name">
                                ${escapeHTML(name)}
                            </div>

                            <div class="entry-time">
                                ${time}
                            </div>

                        </div>

                    </div>

                </div>


                <div class="mood">
                    ${escapeHTML(
                        entry.mood || "❤️"
                    )}
                </div>


                <div class="entry-text">
                    ${escapeHTML(
                        entry.content || ""
                    )}
                </div>


                ${
                    entry.image_url
                    ?
                    `
                    <img
                        class="entry-image"
                        src="${escapeHTML(
                            entry.image_url
                        )}"
                        loading="lazy"
                        onclick="openImage(
                            '${escapeHTML(
                                entry.image_url
                            )}'
                        )">
                    `
                    :
                    ""
                }


                ${
                    entry.user_id ===
                    currentUser.id
                    ?
                    `
                    <div class="entry-footer">

                        <button
                            class="delete-btn"
                            onclick="deleteDiary(
                                '${entry.id}'
                            )">

                            🗑 Xóa

                        </button>

                    </div>
                    `
                    :
                    ""
                }

            `;


            box.appendChild(
                element
            );

        }
    );

}


/* ==========================================================
   DELETE
========================================================== */

async function deleteDiary(id){

    const yes =
        confirm(
            "Bạn chắc chắn muốn xóa ghi chú này?"
        );


    if(!yes)
        return;


    const {error} =
        await db
        .from("diary_entries")
        .delete()
        .eq("id",id)
        .eq(
            "user_id",
            currentUser.id
        );


    if(error){

        console.error(error);

        showToast(
            "Không thể xóa."
        );

        return;
    }


    showToast(
        "Đã xóa."
    );


    await loadDiary();

}


/* ==========================================================
   OPEN IMAGE
========================================================== */

function openImage(url){

    window.open(
        url,
        "_blank"
    );

}


/* ==========================================================
   REALTIME
========================================================== */

function subscribeRealtime(){

    if(realtimeChannel){

        db.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        db
        .channel(
            "diary-live-" +
            currentUser.id
        )
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"diary_entries"
            },
            async () => {

                await loadDiary();

            }
        )
        .subscribe();

}


/* ==========================================================
   LOGOUT
========================================================== */

function logout(){

    if(realtimeChannel){

        db.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;

    }


    currentUser = null;

    sessionStorage.removeItem(
        "diaryUser"
    );


    location.reload();

}


/* ==========================================================
   TOAST
========================================================== */

let toastTimer = null;


function showToast(message){

    const toast =
        document
        .getElementById("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* ==========================================================
   ESCAPE
========================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================================
   ENTER LOGIN
========================================================== */

document
.getElementById("password")
.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Enter"
        ){

            login();

        }

    }
);


/* ==========================================================
   AUTO LOGIN
========================================================== */

(async function(){

    const saved =
        sessionStorage.getItem(
            "diaryUser"
        );


    if(!saved)
        return;


    try{

        currentUser =
            JSON.parse(saved);


        if(!currentUser.id){

            throw new Error(
                "Invalid session"
            );

        }


        await startApp();

    }
    catch(error){

        console.error(error);

        sessionStorage.removeItem(
            "diaryUser"
        );

    }

})();

</script>
